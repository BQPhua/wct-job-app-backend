<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCT Group — Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#101B2D;--accent:#3E5C76;--accent-dark:#2C4356;--cream:#F7F7F6;--ink:#1A1A1A;--ink-soft:#6E6E6D;--line:#E4E4E3;--danger:#B3423A;--ok:#3D7A5C;font-family:'Inter',system-ui,sans-serif;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 16px;}
  h2{font-family:'Source Serif 4',serif;color:var(--navy);margin:0 0 4px;}
  .wrap{max-width:420px;width:100%;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:34px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:13px;font-weight:600;color:var(--navy);}
  .pw-input{font-family:inherit;font-size:14px;padding:10px 12px;border:1px solid #CBD3DB;border-radius:7px;width:100%;}
  .pw-field-wrap{position:relative;}
  .pw-field-wrap .pw-input{padding-right:46px;}
  .pw-toggle-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);border-radius:7px;color:var(--ink-soft);cursor:pointer;padding:0;transition:background .15s ease,color .15s ease;}
  .pw-toggle-btn:hover{background:var(--cream);color:var(--navy);}
  input[type="password"]::-ms-reveal,input[type="password"]::-ms-clear{display:none;}
  input[type="password"]::-webkit-textfield-decoration-container{visibility:hidden;}
  input[type="password"]::-webkit-credentials-auto-fill-button,input[type="password"]::-webkit-contacts-auto-fill-button{display:none !important;visibility:hidden;pointer-events:none;position:absolute;right:0;}
  .pw-checklist{list-style:none;padding:0;margin:0 0 14px;font-size:12.5px;}
  .pw-checklist li{padding:2px 0;color:var(--ink-soft);display:flex;align-items:center;gap:7px;}
  .pw-checklist li.ok{color:var(--ok);}
  .pw-checklist .dot{width:6px;height:6px;border-radius:50%;background:#CBD3DB;flex-shrink:0;}
  .pw-checklist li.ok .dot{background:var(--ok);}
  .btn{font-family:inherit;font-size:14px;font-weight:600;padding:11px;border-radius:8px;border:none;cursor:pointer;width:100%;background:var(--navy);color:#fff;}
  .btn:disabled{background:#A9B6C4;cursor:not-allowed;}
  .error-banner{background:#FBEAE8;border:1px solid #EBBAB4;color:var(--danger);padding:10px 14px;border-radius:7px;font-size:13px;margin-bottom:14px;}
  .success-banner{background:#EAF3EC;border:1px solid #BEDACB;color:var(--ok);padding:10px 14px;border-radius:7px;font-size:13px;margin-bottom:14px;}

  @media(max-width:420px){
    body{padding:20px 12px;}
    .card{padding:22px 18px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div style="text-align:center;margin-bottom:20px;"><img class="wct-logo-img" alt="WCT Group" style="height:44px;"></div>
  <div class="card">
    <h2>Set a New Password</h2>
    <p style="color:var(--ink-soft);font-size:13px;margin-top:0;">Choose a new password for your account.</p>
    <div id="msg"></div>
    <div class="field"><label>New Password <span style="color:var(--danger);">*</span></label>
      <div class="pw-field-wrap">
        <input type="password" id="pw1" class="pw-input" oninput="checkStrength(this.value)">
        <button type="button" id="pw1ToggleBtn" class="pw-toggle-btn" onclick="togglePwField('pw1', this)" title="Show password" aria-label="Show password"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <ul class="pw-checklist" id="pwChecklist">
      <li id="pw-len"><span class="dot"></span> At least 8 characters</li>
      <li id="pw-upper"><span class="dot"></span> One uppercase letter</li>
      <li id="pw-lower"><span class="dot"></span> One lowercase letter</li>
      <li id="pw-num"><span class="dot"></span> One number</li>
      <li id="pw-special"><span class="dot"></span> One special character</li>
    </ul>
    <div class="field"><label>Confirm New Password <span style="color:var(--danger);">*</span></label>
      <div class="pw-field-wrap">
        <input type="password" id="pw2" class="pw-input" oninput="checkMatch()">
        <button type="button" id="pw2ToggleBtn" class="pw-toggle-btn" onclick="togglePwField('pw2', this)" title="Show password" aria-label="Show password"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>
    <div id="matchMsg" style="font-size:12.5px;margin:-8px 0 14px;"></div>
    <button class="btn" id="submitBtn" disabled onclick="doReset()">Update Password</button>
  </div>
</div>
<script>window.API_BASE_URL = "https://wct-job-app-api.azurewebsites.net/api";</script>
<script src="api.js"></script>
<script src="logo.js"></script>
<script>document.querySelectorAll('.wct-logo-img').forEach(el=>el.src=WCT_LOGO_DATA_URI);</script>
<script>
const ICON_EYE_OPEN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICON_EYE_CLOSED = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M6.61 6.61A18.42 18.42 0 0 0 1 12s4 8 11 8a9.26 9.26 0 0 0 5.39-1.61"/><path d="M1 1l22 22"/></svg>';
function togglePwField(inputId, btn){
  const el = document.getElementById(inputId);
  const showing = el.type === 'password';
  el.type = showing ? 'text' : 'password';
  btn.innerHTML = showing ? ICON_EYE_CLOSED : ICON_EYE_OPEN;
  btn.title = showing ? 'Hide password' : 'Show password';
  btn.setAttribute('aria-label', btn.title);
}
let valid = {len:false,upper:false,lower:false,num:false,special:false};
function checkStrength(pw){
  valid.len = pw.length>=8; valid.upper=/[A-Z]/.test(pw); valid.lower=/[a-z]/.test(pw);
  valid.num=/[0-9]/.test(pw); valid.special=/[^A-Za-z0-9]/.test(pw);
  ['len','upper','lower','num','special'].forEach(k=>{ document.getElementById('pw-'+k).className = valid[k]?'ok':''; });
  checkMatch();
}
function checkMatch(){
  const p1=document.getElementById('pw1').value, p2=document.getElementById('pw2').value;
  const allValid = Object.values(valid).every(v=>v);
  const matches = p1 && p2 && p1===p2;
  document.getElementById('matchMsg').innerHTML = p2 ? (matches?'<span style="color:var(--ok);">Passwords match ✓</span>':'<span style="color:var(--danger);">Passwords do not match</span>') : '';
  document.getElementById('submitBtn').disabled = !(allValid && matches);
}
// The backend's reset flow (spec §3.1) issues a short-lived token via
// POST /api/auth/reset-password/request (emailed to the candidate — see
// backend/src/routes/auth.js) rather than Supabase's session-based recovery
// link. This page expects that token as a `?token=` query param, matching
// the link the email points at (e.g. reset-password.html?token=...).
function getResetToken(){
  return new URLSearchParams(window.location.search).get('token') || '';
}

async function doReset(){
  const pw = document.getElementById('pw1').value;
  const token = getResetToken();
  const el = document.getElementById('msg');
  if(!token){ el.innerHTML = `<div class="error-banner">This reset link is missing or invalid. Please request a new one.</div>`; return; }

  const { error } = await apiTry(() => api.post('/auth/reset-password/confirm', { token, password: pw }));
  if(error){ el.innerHTML = `<div class="error-banner">${error.message}</div>`; return; }
  el.innerHTML = `<div class="success-banner">Password updated! Redirecting to sign in...</div>`;
  setTimeout(()=>{ window.location.href = 'login.html'; }, 2000);
}
</script>
</body>
</html>
