function renderAnalyticsCharts(){
  // Tear down any previous instances before redrawing — Chart.js throws if
  // you create a second chart on a canvas that already has one attached.
  Object.values(analyticsCharts).forEach(c => c && c.destroy());
  analyticsCharts = {};
  if(analyticsRows.length === 0) return;

  const rows = analyticsRows;
  const chartFont = { family: 'Inter, system-ui, sans-serif', size: 12 };
  Chart.defaults.font = chartFont;
  Chart.defaults.color = '#6B6D70';

  // --- By status ---
  const statusOrder = ['submitted','shortlisted','kiv','hired','offboarding','rejected','blacklisted'];
  const statusColors = { submitted:'#2E5AAC', shortlisted:'#8A6D1F', kiv:'#B9770E', hired:'#1E7A46', offboarding:'#6B6D70', rejected:'#C0392B', blacklisted:'#1a1a1a' };
  const statusCounts = statusOrder.map(s => rows.filter(r=>r.status===s).length);
  const statusLabels = statusOrder.map(s => STATUS_LABELS[s] || s);
  const elStatus = document.getElementById('chartByStatus');
  if(elStatus){
    analyticsCharts.byStatus = new Chart(elStatus, {
      type: 'doughnut',
      data: { labels: statusLabels, datasets: [{ data: statusCounts, backgroundColor: statusOrder.map(s=>statusColors[s]), borderWidth: 0 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 12, padding: 12 } } }, cutout: '60%' }
    });
  }

  // --- Referral source ---
  const referredYes = rows.filter(r => r.referral_person === 'Yes').length;
  const referredNo = rows.length - referredYes;
  const elReferral = document.getElementById('chartReferral');
  if(elReferral){
    analyticsCharts.referral = new Chart(elReferral, {
      type: 'doughnut',
      data: { labels: ['Referred', 'Not Referred'], datasets: [{ data: [referredYes, referredNo], backgroundColor: ['#3E5C76', '#E5E5E4'], borderWidth: 0 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 12, padding: 12 } } }, cutout: '60%' }
    });
  }

  // --- Over time (by month, based on submitted_at) ---
  const monthCounts = {};
  rows.forEach(r => {
    if(!r.submitted_at) return;
    const d = new Date(r.submitted_at);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
    monthCounts[key] = (monthCounts[key] || 0) + 1;
  });
  const sortedMonths = Object.keys(monthCounts).sort();
  const monthLabels = sortedMonths.map(k => {
    const [y,mo] = k.split('-');
    return new Date(Number(y), Number(mo)-1, 1).toLocaleDateString(undefined, { month:'short', year:'2-digit' });
  });
  const elTime = document.getElementById('chartOverTime');
  if(elTime){
    analyticsCharts.overTime = new Chart(elTime, {
      type: 'line',
      data: { labels: monthLabels, datasets: [{ label:'Submitted', data: sortedMonths.map(k=>monthCounts[k]), borderColor:'#101B2D', backgroundColor:'rgba(16,27,45,.08)', fill:true, tension:.3, pointRadius:3 }] },
      options: { maintainAspectRatio: false, plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }
    });
  }

  // --- By business unit (ALL scope only) ---
  const elUnit = document.getElementById('chartByUnit');
  if(elUnit){
    const units = ['E&C','Land','Mall'];
    const unitCounts = units.map(u => rows.filter(r=>r.business_unit===u).length);
    analyticsCharts.byUnit = new Chart(elUnit, {
      type: 'bar',
      data: { labels: units, datasets: [{ label:'Applications', data: unitCounts, backgroundColor:'#3E5C76', borderRadius:6, maxBarThickness:60 }] },
      options: { maintainAspectRatio: false, plugins:{ legend:{ display:false } }, scales:{ y:{ beginAtZero:true, ticks:{ precision:0 } } } }
    });
  }

  // --- Top positions applied for (top 8, blanks excluded — position_applying
  // is frequently left blank at submission time and assigned later, see the
  // project's own notes on that field) ---
  const elPositions = document.getElementById('chartTopPositions');
  if(elPositions){
    const positionCounts = {};
    rows.forEach(r => {
      const p = (r.position_applying||'').trim();
      if(!p) return;
      positionCounts[p] = (positionCounts[p]||0) + 1;
    });
    const topPositions = Object.entries(positionCounts).sort((a,b)=>b[1]-a[1]).slice(0,8);
    if(topPositions.length === 0){
      elPositions.parentElement.innerHTML = `<p style="color:var(--ink-soft);font-size:13px;">No positions recorded yet on these applications.</p>`;
    } else {
      analyticsCharts.topPositions = new Chart(elPositions, {
        type: 'bar',
        data: { labels: topPositions.map(p=>p[0]), datasets: [{ label:'Applications', data: topPositions.map(p=>p[1]), backgroundColor:'#8A6D1F', borderRadius:6, maxBarThickness:34 }] },
        options: { indexAxis:'y', maintainAspectRatio: false, plugins:{ legend:{ display:false } }, scales:{ x:{ beginAtZero:true, ticks:{ precision:0 } } } }
      });
    }
  }

  // --- Company/entity assignment progress ---
  const elAssign = document.getElementById('chartAssignment');
  if(elAssign){
    const m = analyticsMetrics();
    analyticsCharts.assignment = new Chart(elAssign, {
      type: 'doughnut',
      data: { labels: ['Assigned','Unassigned'], datasets: [{ data: [m.assignedCount, m.unassignedCount], backgroundColor: ['#1E7A46','#E5E5E4'], borderWidth: 0 }] },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 12, padding: 12 } } }, cutout: '60%' }
    });
  }
}

// ============================================================================
// ANALYTICS EXPORT — CSV (raw numbers, for pasting into Excel/Sheets) and
// PDF (formatted report, charts included as static images captured straight
// off the live Chart.js canvases via canvas.toDataURL() — no server-side
// rendering, same browser-print-to-PDF approach used everywhere else in
// this project). Both are summary-level exports only — no candidate PII,
// consistent with how Analytics has worked from the start.
// ============================================================================
function exportAnalyticsCsv(){
  const m = analyticsMetrics();
  const rows = analyticsRows;
  const lines = [];
  const q = (v) => `"${String(v??'').replace(/"/g,'""')}"`;
  const addRow = (arr) => lines.push(arr.map(q).join(','));

  addRow(['WCT Group — Analytics Export']);
  addRow(['Generated', new Date().toLocaleString()]);
  addRow(['Scope', adminScope === 'ALL' ? 'All Business Units' : adminScope]);
  addRow([]);

  addRow(['Summary Metric','Value']);
  addRow(['Total Applications', m.total]);
  addRow(['Hire Rate', m.hireRate+'%']);
  addRow(['Hired', m.hired]);
  addRow(['Submitted (non-draft)', m.submittedCount]);
  addRow(['Avg. Days to Hire (approx.)', m.avgDays===null?'N/A':m.avgDays]);
  addRow(['Currently Offboarding', m.offboarding]);
  addRow(['Compliance Flags', m.flaggedCount]);
  addRow(['Assigned to Company/Entity', m.assignedCount]);
  addRow(['Unassigned', m.unassignedCount]);
  addRow([]);

  addRow(['Status','Count']);
  const statusOrder = ['submitted','shortlisted','kiv','hired','offboarding','rejected','blacklisted'];
  statusOrder.forEach(s => addRow([STATUS_LABELS[s]||s, rows.filter(r=>r.status===s).length]));
  addRow([]);

  addRow(['Referral Source','Count']);
  const referredCount = rows.filter(r=>r.referral_person==='Yes').length;
  addRow(['Referred', referredCount]);
  addRow(['Not Referred', rows.length - referredCount]);
  addRow([]);

  addRow(['Month','Applications Submitted']);
  const monthCounts = {};
  rows.forEach(r => { if(!r.submitted_at) return; const d=new Date(r.submitted_at); const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); monthCounts[key]=(monthCounts[key]||0)+1; });
  Object.keys(monthCounts).sort().forEach(k => addRow([k, monthCounts[k]]));
  addRow([]);

  if(adminScope === 'ALL'){
    addRow(['Business Unit','Count']);
    ['E&C','Land','Mall'].forEach(u => addRow([u, rows.filter(r=>r.business_unit===u).length]));
    addRow([]);
  }

  addRow(['Top Positions Applied For','Count']);
  const positionCounts = {};
  rows.forEach(r => { const p=(r.position_applying||'').trim(); if(!p) return; positionCounts[p]=(positionCounts[p]||0)+1; });
  Object.entries(positionCounts).sort((a,b)=>b[1]-a[1]).slice(0,8).forEach(([p,c])=>addRow([p,c]));

  const csv = lines.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `wct-analytics-summary-${new Date().toISOString().slice(0,10)}.csv`;
  link.click();
  URL.revokeObjectURL(url);
}

        <div class="hint" style="font-size:12px;color:var(--ink-soft);margin:-6px 0 12px;">They'll appear below as "not yet signed in" until they complete their first Microsoft sign-in — grant their access now, it takes effect the moment they do.</div>
        <div id="adminMgmtErr"></div>
        <button class="btn btn-primary btn-sm" onclick="submitInviteAdmin()">Send Invite</button>
      </div>
    ` : ''}

    <div id="adminMgmtResults">${adminMgmtResultsHtml()}</div>
  `;
}

function adminMgmtResultsHtml(){
  if(adminMgmtList.length === 0){
    return `<div class="empty-state">No admins yet. Use "+ Invite Admin" above — don't forget to also seed your own Super Admin row directly in the database first (see the migration file), or you won't be able to sign in at all.</div>`;
  }
  return adminMgmtList.map(a => adminMgmtCardHtml(a)).join('');
}

const ROLE_LABELS = { super_admin: 'Super Admin', bu_admin: 'Business Unit Admin', entity_admin: 'Entity Admin (Phase 2)' };

function adminMgmtCardHtml(a){
  const existingRoleEl = document.getElementById('newGrantRole_'+a.id);
  const grantRoleSel = existingRoleEl ? existingRoleEl.value : 'bu_admin';
  return `
    <div class="detail-section" style="background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;margin-bottom:12px;box-shadow:var(--shadow-sm);">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;">
        <div>
          <div style="font-weight:700;font-size:14.5px;">${esc(a.display_name || a.email)}</div>
          <div style="font-size:12.5px;color:var(--ink-soft);">${esc(a.email)} · ${a.linked ? 'Signed in before' : 'Not yet signed in'}</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <span class="badge" style="background:${a.is_active?'var(--ok-tint)':'var(--danger-tint)'};color:${a.is_active?'var(--ok)':'var(--danger)'};">${a.is_active?'Active':'Deactivated'}</span>
          <button class="btn btn-outline btn-sm" onclick="toggleAdminActive('${a.id}', ${!a.is_active})">${a.is_active?'Deactivate':'Reactivate'}</button>
        </div>
      </div>

      <div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;">
        ${a.grants.length === 0 ? `<span style="color:var(--ink-soft);font-size:12.5px;">No grants yet — this person cannot sign in until granted something below.</span>` : a.grants.map(g => `
          <span class="badge" style="background:var(--accent-tint);color:var(--accent-dark);">
            ${g.role==='super_admin' ? 'Super Admin' : esc(g.business_unit)+' Admin'}
            <span style="cursor:pointer;margin-left:6px;font-weight:700;" title="Revoke" onclick="revokeGrant('${g.id}')">✕</span>
          </span>
        `).join('')}
      </div>

      ${adminMgmtGrantFormFor === a.id ? `
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);">
          <select id="newGrantRole_${a.id}" class="select-clean" onchange="renderAdminMgmtResults()">
            <option value="bu_admin" ${grantRoleSel!=='super_admin'?'selected':''}>Business Unit Admin</option>
            <option value="super_admin" ${grantRoleSel==='super_admin'?'selected':''}>Super Admin</option>
          </select>
          <select id="newGrantBu_${a.id}" class="select-clean" ${grantRoleSel==='super_admin'?'disabled':''}>
            <option value="E&C">E&amp;C</option>
            <option value="Land">Land</option>
            <option value="Mall">Mall</option>
          </select>
          <button class="btn btn-primary btn-sm" onclick="submitAddGrant('${a.id}')">Add Grant</button>
          <button class="btn btn-outline btn-sm" onclick="adminMgmtGrantFormFor=null;renderAdminMgmtResults();">Cancel</button>
        </div>
      ` : `
        <button class="btn btn-outline btn-sm" style="margin-top:12px;" onclick="adminMgmtGrantFormFor='${a.id}';renderAdminMgmtResults();">+ Add Grant</button>
      `}
    </div>
  `;
}

function renderAdminMgmtResults(){
  const el = document.getElementById('adminMgmtResults');
  if(el) el.innerHTML = adminMgmtResultsHtml();
}

async function submitInviteAdmin(){
  const email = document.getElementById('newAdminEmail').value.trim();
  const name = document.getElementById('newAdminName').value.trim();
  if(!email){ document.getElementById('adminMgmtErr').innerHTML = `<div class="error-banner">Email is required.</div>`; return; }
  showLoading('Inviting...');
  try{
    const { error } = await apiTry(() => api.post('/admin/admins', { email, display_name: name }, {admin: true}));
    if(error) throw error;
    adminMgmtInviteOpen = false;
    await loadAdminMgmtList();
    hideLoading();
    renderAdminAccessShell();
  } catch(e){ hideLoading(); document.getElementById('adminMgmtErr').innerHTML = `<div class="error-banner">${e.message}</div>`; }
}

async function submitAddGrant(adminUserId){
  const role = document.getElementById('newGrantRole_'+adminUserId).value;
  const buEl = document.getElementById('newGrantBu_'+adminUserId);
  const businessUnit = role === 'bu_admin' ? buEl.value : null;
  showLoading('Adding grant...');
  try{
    const { error } = await apiTry(() => api.post(`/admin/admins/${adminUserId}/grants`, { role, business_unit: businessUnit }, {admin: true}));
    if(error) throw error;
    adminMgmtGrantFormFor = null;
    await loadAdminMgmtList();
    hideLoading();
    renderAdminMgmtResults();
  } catch(e){ hideLoading(); alert('Error: '+e.message); }
}

async function revokeGrant(grantId){
  if(!confirm('Revoke this grant? The admin will lose that access immediately.')) return;
  showLoading('Revoking...');
  try{
    const { error } = await apiTry(() => api.del(`/admin/grants/${grantId}`, {admin: true}));
    if(error) throw error;
    await loadAdminMgmtList();
    hideLoading();
    renderAdminMgmtResults();
  } catch(e){ hideLoading(); alert('Error: '+e.message); }
}

async function toggleAdminActive(adminUserId, newActive){
  if(!newActive && !confirm('Deactivate this admin? They will be signed out and unable to sign in again until reactivated.')) return;
  showLoading('Updating...');
  try{
    const { error } = await apiTry(() => api.patch(`/admin/admins/${adminUserId}/active`, { is_active: newActive }, {admin: true}));
    if(error) throw error;
    await loadAdminMgmtList();
    hideLoading();
    renderAdminMgmtResults();
  } catch(e){ hideLoading(); alert('Error: '+e.message); }
}

// ============================================================================
// COMPANY SETTINGS — available to every admin scope (unlike Permission/
// Manager Settings, which are All Units only). A business-unit-scoped admin
// (E&C/Land/Mall) can add, edit, and delete companies belonging ONLY to
// their own business_unit; an All Units admin can manage every company
// across all three units. This is a straight ownership check on
// companies.business_unit — separate from, and simpler than, the
// category-based admin_unit_permissions grants used for candidate
// assignment (Permission Settings), which stays untouched by this feature.
// ============================================================================
let companyMgmtList = [];
let companyMgmtSearch = '';
let companyMgmtAddOpen = false;
let companyMgmtEditId = null;
let entityCategoryList = []; // options for the Entity dropdown — from rpc_admin_list_entity_categories
let showNewEntityInput = false; // toggles the "+ Add new entity" free-text fallback on the Add form

async function loadEntityCategoryList(){
  try{
    const { data, error } = await apiTry(() => api.get('/admin/entity-categories', {admin: true}));
    if(error) throw error;
    entityCategoryList = data || [];
  } catch(e){ entityCategoryList = []; }
}

async function loadCompanyMgmtList(){
  try{
    const { data, error } = await apiTry(() => api.get('/admin/companies/manage', {admin: true}));
    if(error) throw error;
    companyMgmtList = data || [];
  } catch(e){ alert('Error loading companies: '+e.message); companyMgmtList = []; }
}

function filterCompanyMgmtList(v){
  companyMgmtSearch = v;
  renderCompanyMgmtResults();
}

function filteredCompanyMgmtList(){
  const q = companyMgmtSearch.trim().toLowerCase();
  if(!q) return companyMgmtList;
  return companyMgmtList.filter(c =>
    (c.name||'').toLowerCase().includes(q) ||
    (c.category||'').toLowerCase().includes(q) ||
    (c.business_unit||'').toLowerCase().includes(q)
  );
}

function companySettingsPageView(){
  const isAll = adminScope === 'ALL';
  return `
    <div class="stat-row">
      <div class="stat" style="flex:none;min-width:auto;">
        <h2 style="font-size:20px;margin:0;">Company Settings</h2>
        <div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;">
          ${isAll
            ? 'Add, edit, or remove companies/entities across all business units. This list feeds the Company/Entity dropdown on each application.'
            : `Add, edit, or remove companies/entities under <strong>${esc(adminScope)}</strong>. This list feeds the Company/Entity dropdown on each application.`}
        </div>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="companyMgmtSearchInput" placeholder="Search companies by name or category..." value="${esc(companyMgmtSearch)}" oninput="filterCompanyMgmtList(this.value)">
      <button class="btn btn-primary btn-sm" onclick="toggleAddCompanyForm()">${companyMgmtAddOpen ? 'Cancel' : '+ Add Company'}</button>
    </div>

    ${companyMgmtAddOpen ? addCompanyFormHtml() : ''}

    <div id="companyMgmtErr"></div>
    <div id="companyMgmtResults">${companyMgmtResultsHtml()}</div>
  `;
}

function addCompanyFormHtml(){
  const isAll = adminScope === 'ALL';
  return `
    <div class="detail-section" style="background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm);">
      <h4 style="border-top:none;padding-top:0;">New Company / Entity</h4>
      <div class="grid g3" style="display:grid;grid-template-columns:${isAll?'1fr 1fr 1fr':'1fr 1fr'};gap:14px;">
        <div class="field"><label>Name <span style="color:var(--danger);">*</span></label>
          <input type="text" id="newCompanyName" placeholder="e.g. WCT Berhad">
        </div>
        <div class="field"><label>Entity <span style="color:var(--danger);">*</span></label>
          ${!showNewEntityInput ? `
            <select id="newCompanyCategory" class="select-clean" onchange="if(this.value==='__new__'){ showNewEntityInput=true; renderCompanySettingsShell(); }">
              ${entityCategoryList.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}
              <option value="__new__">+ Add new entity...</option>
            </select>
          ` : `
            <div style="display:flex;gap:6px;">
              <input type="text" id="newCompanyCategory" placeholder="e.g. Aviation" style="flex:1;">
              <button type="button" class="btn btn-outline btn-sm" title="Choose an existing entity instead" onclick="showNewEntityInput=false; renderCompanySettingsShell();">✕</button>
            </div>
            <div class="hint" style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">This creates a brand-new entity type — it'll also appear in Business Unit Settings automatically so an All Units admin can grant assignment permission for it.</div>
          `}
        </div>
        ${isAll ? `
        <div class="field"><label>Business Unit <span style="color:var(--danger);">*</span></label>
          <select id="newCompanyBu" class="select-clean">
            <option value="E&C">E&amp;C</option>
            <option value="Land">Land</option>
            <option value="Mall">Mall</option>
          </select>
        </div>` : ''}
      </div>
      ${!isAll ? `<div class="hint" style="font-size:12px;color:var(--ink-soft);margin:-6px 0 12px;">Will be added under your own business unit: <strong>${esc(adminScope)}</strong>.</div>` : ''}
      <button class="btn btn-primary btn-sm" onclick="submitAddCompany()">Save Company</button>
    </div>
  `;
}

function renderCompanySettingsShell(){
  // Toggling the Add-Company form (and closing it after a successful save)
  // changes the SHELL — the toolbar/button/form live outside
  // #companyMgmtResults — so the lighter renderCompanyMgmtResults() can't
  // pick it up. This forces a full shell rebuild for those cases, while
  // renderCompanyMgmtResults() stays the right tool for search/edit/refresh
  // (row-only changes that shouldn't touch the search input's focus).
  const root = document.getElementById('root');
  root.innerHTML = `<div class="wrap">${companySettingsPageView()}</div>`;
  lastRenderedView = 'companies';
}

function toggleAddCompanyForm(){
  companyMgmtAddOpen = !companyMgmtAddOpen;
  showNewEntityInput = false;
  renderCompanySettingsShell();
}

async function submitAddCompany(){
  const name = document.getElementById('newCompanyName').value.trim();
  const category = document.getElementById('newCompanyCategory').value.trim();
  const buEl = document.getElementById('newCompanyBu');
  const business_unit = buEl ? buEl.value : adminScope;
  if(!name || !category || category === '__new__'){
    document.getElementById('companyMgmtErr').innerHTML = `<div class="error-banner">Name and entity are both required.</div>`;
    return;
  }
  showLoading('Adding company...');
  try{
    const { error } = await apiTry(() => api.post('/admin/companies', { name, category, business_unit }, {admin: true}));
    if(error) throw error;
    companyMgmtAddOpen = false;
    showNewEntityInput = false;
    await Promise.all([loadCompanyMgmtList(), loadEntityCategoryList(), loadCompanyLookup()]);
    hideLoading();
    renderCompanySettingsShell();
  } catch(e){ hideLoading(); document.getElementById('companyMgmtErr').innerHTML = `<div class="error-banner">${e.message}</div>`; }
}


function companyMgmtResultsHtml(){
  const isAll = adminScope === 'ALL';
  const list = filteredCompanyMgmtList();
  if(companyMgmtList.length === 0){
    return `<div class="empty-state">No companies yet${isAll ? '' : ` under ${esc(adminScope)}`}. Use "+ Add Company" above to create one.</div>`;
  }
  if(list.length === 0){
    return `<div class="empty-state">No companies match "${esc(companyMgmtSearch)}".</div>`;
  }
  return `
    <table>
      <thead><tr>
        <th>Name</th>
        <th>Entity</th>
        ${isAll ? '<th>Business Unit</th>' : ''}
        <th style="width:1%;white-space:nowrap;">Actions</th>
      </tr></thead>
      <tbody>
        ${list.map(c => companyMgmtRowHtml(c, isAll)).join('')}
      </tbody>
    </table>
  `;
}

function companyMgmtRowHtml(c, isAll){
  if(companyMgmtEditId === c.id){
    return `
      <tr class="data-row">
        <td><input type="text" id="editCompanyName_${c.id}" value="${esc(c.name)}" style="width:100%;"></td>
        <td>
          <select id="editCompanyCategory_${c.id}" class="select-clean" style="width:100%;">
            ${[...new Set([c.category, ...entityCategoryList])].map(cat=>`<option value="${esc(cat)}" ${cat===c.category?'selected':''}>${esc(cat)}</option>`).join('')}
          </select>
        </td>
        ${isAll ? `<td><span class="badge" style="background:var(--accent-tint);color:var(--accent-dark);">${esc(c.business_unit)}</span></td>` : ''}
        <td>
          <div class="row-actions">
            <button class="btn btn-primary btn-sm" onclick="submitEditCompany('${c.id}')">Save</button>
            <button class="btn btn-outline btn-sm" onclick="cancelEditCompany()">Cancel</button>
          </div>
        </td>
      </tr>
    `;
  }
  return `
    <tr class="data-row">
      <td>${esc(c.name)}</td>
      <td>${esc(c.category)}</td>
      ${isAll ? `<td><span class="badge" style="background:var(--accent-tint);color:var(--accent-dark);">${esc(c.business_unit)}</span></td>` : ''}
      <td>
        <div class="row-actions">
          <button class="btn btn-outline btn-sm" onclick="startEditCompany('${c.id}')">Edit</button>
          <button class="btn btn-outline-danger btn-sm" onclick="deleteCompanyRow('${c.id}', '${esc(c.name).replace(/'/g,"\\'")}')">Delete</button>
        </div>
      </td>
    </tr>
  `;
}

function renderCompanyMgmtResults(){
  const el = document.getElementById('companyMgmtResults');
  if(el) el.innerHTML = companyMgmtResultsHtml();
}

function startEditCompany(id){
  companyMgmtEditId = id;
  renderCompanyMgmtResults();
}
function cancelEditCompany(){
  companyMgmtEditId = null;
  renderCompanyMgmtResults();
}

async function submitEditCompany(id){
  const name = document.getElementById('editCompanyName_'+id).value.trim();
  const category = document.getElementById('editCompanyCategory_'+id).value.trim();
  if(!name || !category){ alert('Name and category are both required.'); return; }
  showLoading('Saving...');
  try{
    const { error } = await apiTry(() => api.patch(`/admin/companies/${id}`, { name, category }, {admin: true}));
    if(error) throw error;
    companyMgmtEditId = null;
    await loadCompanyMgmtList();
    await loadCompanyLookup();
    hideLoading();
    render();
  } catch(e){ hideLoading(); alert('Error saving: '+e.message); }
}

async function deleteCompanyRow(id, name){
  if(!confirm(`Delete "${name}" from the company list? This cannot be undone, and will fail if any applications are currently assigned to it.`)) return;
  showLoading('Deleting...');
  try{
    const { error } = await apiTry(() => api.del(`/admin/companies/${id}`, {admin: true}));
    if(error) throw error;
    await loadCompanyMgmtList();
    await loadCompanyLookup();
    hideLoading();
    render();
  } catch(e){ hideLoading(); alert('Error deleting: '+e.message); }
}

async function saveCompanyAssignment(id){
  const companyId = document.getElementById('assignCompanySelect').value || null;
  try{
    const { error } = await apiTry(() => api.post(`/admin/applications/${id}/company`, { company_id: companyId }, {admin: true}));
    if(error) throw error;
    // Assign-and-close, rather than reopening the same modal — the person
    // already sees the updated Company column on the dashboard table
    // immediately after loadApplications() below.
    closeDetail();
    await loadCompanyLookup();
    await loadApplications();
  } catch(e){ document.getElementById('assignCompanyErr').innerHTML = `<div class="error-banner">${e.message}</div>`; }
}

function renderModal(){
  const a = selectedApp;
  const existing = document.getElementById('modalRoot');
  if(existing) existing.remove();
  const div = document.createElement('div');
  div.id = 'modalRoot';
  div.className = 'modal-overlay';
  div.onclick = (e)=>{ if(e.target===div) closeDetail(); };

  div.innerHTML = `
    <div class="modal">
      <button class="modal-close" onclick="closeDetail()">✕</button>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:6px;">
        ${a.profile_picture_url?`<img class="pfp" style="width:64px;height:64px;" src="${a.profile_picture_url}">`:''}
        <div>
          <h2 style="margin-bottom:2px;">${esc(a.name_nric)}</h2>
          <div style="color:var(--ink-soft);font-size:13px;">${esc(a.reference_no)} · ${esc(a.business_unit)} · <strong>${esc(a.position_applying)}</strong></div>
        </div>
      </div>
      <span class="badge ${a.status}" style="margin-bottom:16px;display:inline-block;">${STATUS_LABELS[a.status]||a.status}</span>

      ${editingApp ? editFormHtml(a) : viewDetailHtml(a)}

  `;
  document.body.appendChild(div);
}

function startEdit(){ editingApp = true; render(); }
function cancelEdit(){ editingApp = false; render(); }

async function saveEdit(){
  const buEl = document.getElementById('editBusinessUnit');
  const patch = {
    name_nric: document.getElementById('editName').value.trim(),
    email: document.getElementById('editEmail').value.trim(),
    mobile_phone: document.getElementById('editMobile').value.trim()
  };
  if(buEl) patch.business_unit = buEl.value; // only present for ALL-scope admins
  try{
    const { error } = await apiTry(() => api.patch(`/admin/applications/${selectedApp.id}`, patch, {admin: true}));
    if(error) throw error;
    editingApp = false;
    await openDetail(selectedApp.id);
    await loadApplications();
  } catch(e){ alert('Error saving: '+e.message); }
}

async function updateStatus(status){
  const label = STATUS_LABELS[status] || status;
  const warnMsg = status === 'blacklisted'
    ? 'Blacklist this candidate? They will be signed out immediately and blocked from logging in or applying again using this email. This can be reversed later by changing their status.'
    : status === 'offboarding'
    ? `Move this application to "Offboarding"? The candidate will be prompted to complete their Exit Interview Form.`
    : `Change this application's status to "${label}"? The candidate will be notified by email.`;
  if(!confirm(warnMsg)) return;
  try{
    let result;
    if(STATUS_VIA_DEDICATED_RPC[status]){
      result = await apiTry(() => api.post(`/admin/applications/${selectedApp.id}/offboarding`, {}, {admin: true}));
    } else {
      result = await apiTry(() => api.post(`/admin/applications/${selectedApp.id}/status`, {status}, {admin: true}));
    }
    const { error } = result;
    if(error) throw error;
    await openDetail(selectedApp.id);
    await Promise.all([loadApplications(), loadStats()]);
  } catch(e){ alert('Error: '+e.message); }
}

let onboardingData = null;
let onboardingAppInfo = null; // basic application record (name/reference) for the onboarding
// modal's header + PDF export — deliberately kept separate from `selectedApp`,
// since that variable also controls whether the full detail modal re-opens
// on every render() and whether the 20s auto-refresh poll pauses. Reusing
// it here would silently pop open the detail modal and freeze the
// dashboard's auto-refresh any time someone views onboarding without
// having opened the detail modal first.

async function openOnboardingView(applicationId){
  try{
    const needsAppFetch = !(selectedApp && selectedApp.id === applicationId);
    const [obRes, appRes] = await Promise.all([
      apiTry(() => api.get(`/admin/applications/${applicationId}/onboarding`, {admin: true})),
      needsAppFetch
        ? apiTry(() => api.get(`/admin/applications/${applicationId}`, {admin: true}))
        : Promise.resolve({ data: selectedApp, error: null })
    ]);
    if(obRes.error) throw obRes.error;
    if(appRes.error) throw appRes.error;
    onboardingData = obRes.data;
    onboardingAppInfo = appRes.data;
    renderOnboardingModal();
  } catch(e){ alert('Error loading onboarding details: '+e.message); }
}
function closeOnboardingModal(){
  onboardingData = null;
  onboardingAppInfo = null;
  const existing = document.getElementById('onboardingModalRoot');
  if(existing) existing.remove();
}

function renderOnboardingModal(){
  const existing = document.getElementById('onboardingModalRoot');
  if(existing) existing.remove();
  const o = onboardingData;
  if(!o){
    alert('No onboarding record found for this candidate yet — they may not have started it.');
    return;
  }

  const div = document.createElement('div');
  div.id = 'onboardingModalRoot';
  div.className = 'modal-overlay';
  div.style.zIndex = '70';
  div.onclick = (e)=>{ if(e.target===div) closeOnboardingModal(); };
  div.innerHTML = `
    <div class="modal" style="max-width:760px;">
      <button class="modal-close" onclick="closeOnboardingModal()">✕</button>
      <h2>Onboarding Details</h2>
      <p style="color:var(--ink-soft);font-size:13px;margin-top:-6px;">Status: ${o.status==='completed' ? '<strong style="color:var(--ok);">Completed</strong>' : '<strong style="color:var(--warn);">In Progress</strong>'}</p>

      <div class="status-actions">
        <button class="btn btn-outline btn-sm" onclick="exportOnboardingPdf()">📄 Export to PDF</button>
      </div>
    </div>
  `;
  document.body.appendChild(div);

function exportOnboardingPdf(){
  if(!onboardingData || !onboardingAppInfo){ alert('No onboarding data loaded.'); return; }
  const html = buildOnboardingPdfHtml(onboardingAppInfo, onboardingData);
  const win = window.open('', '_blank');
  if(!win){ alert('Please allow pop-ups for this site to generate the PDF.'); return; }
  win.document.open();
  win.document.write(html);
  win.document.close();
  win.onload = () => setTimeout(() => win.print(), 400);
}

// in whichever language the candidate chose.
// ============================================================================
function fmt(v){ return (v===null||v===undefined||v==='') ? '—' : esc(String(v)); }
function fmtDate(v){ if(!v) return '—'; try{ return new Date(v).toLocaleDateString('en-GB'); }catch(e){ return esc(v); } }
function fmtDateTime(v){ if(!v) return '—'; try{ return new Date(v).toLocaleString('en-GB'); }catch(e){ return esc(v); } }

async function exportCandidatePdf(id){
  let a = applications.find(x=>x.id===id);
  if(!a || (selectedApp && a.id !== selectedApp.id)){
    try{
      const { data, error } = await apiTry(() => api.get(`/admin/applications/${id}`, {admin: true}));
      if(error) throw error;
      a = data;
    } catch(e){ alert('Could not load record for export: '+e.message); return; }
  }
  const html = buildFormalPdfHtml(a);
  const win = window.open('', '_blank');
  if(!win){ alert('Please allow pop-ups for this site to generate the PDF.'); return; }
  win.document.open();
  win.document.write(html);
  win.document.close();
  win.onload = () => setTimeout(() => win.print(), 400);
}

// ============================================================================
// BOOT
// ============================================================================
// Deep link from an email — admin.html?app=<application id> opens straight
// into that application's detail modal (e.g. "an employee has submitted
// their Exit Interview — click to review and sign") instead of the generic
// dashboard. Same idea as index.html's ?onboarding=/?exit= links. Stripped
// from the URL immediately so refreshing afterward doesn't keep re-opening
// the same modal, and consumed once whichever of boot-with-existing-session
// or doLogin() runs first actually has a token to fetch with.
let deepLinkAppId = new URLSearchParams(window.location.search).get('app');
if(deepLinkAppId) window.history.replaceState({}, '', window.location.pathname);
async function openDeepLinkedAppIfAny(){
  if(!deepLinkAppId) return;
  const id = deepLinkAppId;
  deepLinkAppId = null;
  await openDetail(id);
}

if(adminToken && adminScope && adminScope !== 'ALL') filterBusinessUnit = adminScope;
render();
if(adminToken) loadEverything().then(openDeepLinkedAppIfAny).then(loadCurrentUserProfile);

// ============================================================================
// Microsoft sign-in no longer has a persistent Supabase Auth session to
// restore or an onAuthStateChange event to listen for — MSAL.js (oauth.js)
// gets the ID token via a popup and attemptAdminBootstrap() is called
// directly from doMicrosoftLogin() the moment that happens. The only thing
// that needs restoring across page loads is the plain admin JWT string,
// which is already loaded from localStorage into `adminToken` at the top of
// this script (via api.getAdminToken()) and handled by the `if(adminToken)`
// check above — so there's nothing left to do here.
// ============================================================================

window.addEventListener('resize', () => {
  // Crossing the mobile breakpoint mid-session (rotating a tablet, resizing
  // a desktop window) shouldn't leave the drawer stuck open over a now-wide
  // layout.
  if(!isMobileViewport() && sidebarMobileOpen){ sidebarMobileOpen = false; renderSidebarChrome(); }
});

// ============================================================================
// AUTO-REFRESH — polls every 20 seconds while on the Home view, so new
// submissions and status changes appear without needing a manual refresh.
// ============================================================================
setInterval(() => {
  if(adminToken && currentView === 'home' && !selectedApp){
    loadApplications();
    loadStats();
    loadPendingExitSignatureCount().then(renderDashboardResults);
  }
}, 20000);
</script>
</body>
