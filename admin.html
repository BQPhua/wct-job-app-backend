<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WCT Group — HR Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="msal-browser.min.js"></script>
<style>
  :root{
    --navy:#101B2D;
    --navy-2:#1C2C44;
    --accent:#3E5C76;
    --accent-dark:#2C4356;
    --accent-tint:#EAF0F5;
    --cream:#F6F6F5;
    --paper:#FFFFFF;
    --ink:#17181A;
    --ink-soft:#6B6D70;
    --line:#E5E5E4;
    --danger:#C0392B;
    --danger-tint:#FBEAE8;
    --ok:#1E7A46;
    --ok-tint:#E7F5EC;
    --warn:#B9770E;
    --warn-tint:#FDF3E3;
    --info:#2E5AAC;
    --info-tint:#EAF0FB;
    --radius:10px;
    --shadow-sm:0 1px 2px rgba(10,10,10,.06);
    --shadow-md:0 4px 14px rgba(10,10,10,.10);
    --shadow-lg:0 10px 30px rgba(10,10,10,.16);
    font-family:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);}
  h1,h2,h3{font-family:'Source Serif 4',serif;color:var(--navy);margin:0 0 .3em;}
  a{color:var(--info);}

  /* ============================================================
     APP SHELL — dark collapsible sidebar + light content area,
     replacing the old single dark topbar. Sidebar width persists
     across page loads via localStorage (real browser storage is
     fine here — this is a deployed site, not an in-chat artifact
     sandbox); the mobile drawer state does not persist, since it
     should always start closed on a fresh page load.
     ============================================================ */
  .app-shell{display:flex;min-height:100vh;min-height:100dvh;}

  .sidebar{
    width:230px;flex-shrink:0;background:var(--navy);color:#fff;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;
    transition:width .18s ease;overflow:hidden;z-index:30;
  }
  .sidebar.collapsed{width:64px;}
  .sidebar-brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0;}
  .sidebar-brand img{height:28px;max-width:38px;object-fit:contain;background:#fff;border-radius:5px;padding:3px 7px;flex-shrink:0;}
  .sidebar-brand .brand-text{overflow:hidden;white-space:nowrap;}
  .sidebar-brand .name{font-size:13.5px;font-weight:700;line-height:1.3;}
  .sidebar-brand .sub{font-size:11px;color:#9AA4B0;}
  .sidebar.collapsed .brand-text{display:none;}
  .sidebar.collapsed .sidebar-brand{justify-content:center;padding:18px 8px;}

  .sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
  .sidebar-nav a{
    display:flex;align-items:center;gap:12px;color:#C9C9C9;font-size:13.5px;font-weight:600;
    text-decoration:none;padding:10px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;
    transition:background .15s ease,color .15s ease;position:relative;
  }
  .sidebar-nav a svg{flex-shrink:0;width:18px;height:18px;}
  .sidebar-nav a:hover{background:rgba(255,255,255,.06);color:#fff;}
  .sidebar-nav a.active{background:#fff;color:var(--navy);}
  .sidebar-nav a.active svg{color:var(--navy);}
  .sidebar.collapsed .sidebar-nav a{justify-content:center;padding:10px;}
  .sidebar.collapsed .sidebar-nav a .nav-label,
  .sidebar.collapsed .sidebar-nav a .nav-badge{display:none;}
  .nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;border-radius:10px;padding:1px 7px;flex-shrink:0;}

  .sidebar-footer{padding:12px 10px;border-top:1px solid rgba(255,255,255,.08);flex-shrink:0;}
  .sidebar-scope{font-size:10.5px;color:#9AA4B0;text-transform:uppercase;letter-spacing:.04em;padding:6px 12px;white-space:nowrap;overflow:hidden;}
  .sidebar.collapsed .sidebar-scope{display:none;}
  .sidebar-footer .btn{width:100%;justify-content:center;}
  .sidebar.collapsed .sidebar-footer .btn span.btn-label{display:none;}

  .sidebar-backdrop{display:none;}

  /* Pre-auth (login screen) — the sidebar/topbar chrome doesn't make sense
     to show before there's anything to navigate to, so it's hidden and the
     login page takes the full viewport instead. */
  .app-shell.pre-auth .sidebar,
  .app-shell.pre-auth .sidebar-backdrop,
  .app-shell.pre-auth .topbar-slim{display:none;}

  .main-area{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar-slim{
    background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;
    display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;
  }
  .sidebar-toggle-btn{
    background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--navy);flex-shrink:0;
  }
  .sidebar-toggle-btn:hover{background:var(--cream);}
  .topbar-slim .page-title{font-family:'Source Serif 4',serif;color:var(--navy);font-size:17px;font-weight:700;}
  .topbar-slim .page-subtitle{font-size:12px;color:var(--ink-soft);margin-top:1px;}

  /* Topbar user profile chip — since admins now sign in with their real
     Microsoft identity (Phase 1), show who's logged in instead of a bare
     Logout button hiding in the sidebar. */
  .user-chip{display:flex;align-items:center;gap:9px;cursor:pointer;padding:6px 10px 6px 6px;border-radius:20px;transition:background .15s ease;}
  .user-chip:hover{background:var(--cream);}
  .user-avatar{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;font-family:'Source Serif 4',serif;}
  .user-chip-name{font-size:13px;font-weight:600;color:var(--ink);line-height:1.2;}
  .user-chip-name .sub{font-weight:400;color:var(--ink-soft);font-size:11px;}
  .user-dropdown{position:absolute;top:100%;right:0;margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-md);min-width:230px;padding:14px;z-index:50;}
  .user-dropdown .dd-name{font-weight:700;font-size:14px;color:var(--navy);}
  .user-dropdown .dd-email{font-size:12px;color:var(--ink-soft);margin-bottom:12px;word-break:break-all;}
  @media(max-width:600px){ .user-chip-name{display:none;} }

  .wrap{max-width:1360px;margin:0 auto;padding:24px 24px 60px;}

  /* ---------- Buttons: real interactivity, not stickers ---------- */
  .btn{
    font-family:inherit;font-size:13.5px;font-weight:600;
    padding:9px 16px;border-radius:8px;border:1px solid transparent;
    cursor:pointer;transition:transform .08s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
    display:inline-flex;align-items:center;gap:6px;line-height:1.2;
    box-shadow:var(--shadow-sm);
  }
  .btn:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .btn:active{transform:translateY(0);box-shadow:none;}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{background:#a32e21;}
  .btn-success{background:var(--ok);color:#fff;}
  .btn-success:hover{background:#155e35;}
  .btn-shortlist{background:#C99A2E;color:#fff;}
  .btn-shortlist:hover{background:#A87F22;}
  .btn-blacklist{background:#1a1a1a;color:#fff;}
  .btn-blacklist:hover{background:#000;}
  .btn-offboarding{background:#6B6D70;color:#fff;}
  .btn-offboarding:hover{background:#54524F;}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:hover{background:var(--accent-dark);}
  .btn-outline{background:#fff;color:var(--navy);border-color:var(--line);}
  .btn-outline:hover{background:var(--cream);border-color:#C9C9C8;}
  .btn-outline-danger{background:#fff;color:var(--danger);border-color:#EBC3BD;}
  .btn-outline-danger:hover{background:var(--danger-tint);}
  .btn-sm{padding:6px 12px;font-size:12.5px;}
  .btn-icon{padding:7px 9px;}

  /* ---------- Layout pieces ---------- */
  .stat-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;flex:1;min-width:110px;box-shadow:var(--shadow-sm);transition:border-color .15s ease,box-shadow .15s ease;}
  .stat:hover{border-color:var(--accent);box-shadow:var(--shadow-md);}
  .stat.stat-active{border-color:var(--navy);border-width:2px;box-shadow:var(--shadow-md);}
  .stat .n{font-size:24px;font-weight:700;color:var(--navy);font-family:'Source Serif 4',serif;}
  .stat .l{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}

  .toolbar{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px;box-shadow:var(--shadow-sm);display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .toolbar input[type=text], .toolbar select{
    font-family:inherit;font-size:13.5px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;
  }
  .toolbar input[type=text]{flex:1;min-width:220px;}
  .toolbar select{width:auto;}

  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
  /* overflow:hidden used to be here to make the border-radius show on the
     table's corners, but that also clipped the status-panel dropdown
     (position:absolute, extends past the table's own box) — replicate the
     same rounded-corner look without clipping child content instead. */
  thead tr:first-child th:first-child{border-top-left-radius:var(--radius);}
  thead tr:first-child th:last-child{border-top-right-radius:var(--radius);}
  tbody tr:last-child td:first-child{border-bottom-left-radius:var(--radius);}
  tbody tr:last-child td:last-child{border-bottom-right-radius:var(--radius);}
  th{background:var(--navy);color:#fff;text-align:left;padding:11px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  td{padding:11px 14px;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.data-row:hover{background:#FAFAF9;}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap;}

  .badge{display:inline-flex;align-items:center;justify-content:center;line-height:1;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
  .badge.submitted{background:var(--info-tint);color:var(--info);}
  .badge.under_review{background:var(--warn-tint);color:var(--warn);}
  .badge.shortlisted{background:#FFF3D6;color:#8A6D1F;}
  .badge.interview_scheduled{background:#EEE8FB;color:#6A3FC0;} /* historical only, no longer selectable */
  .badge.offer_sent{background:#FCEFE0;color:#B9660E;} /* historical only, no longer selectable */
  .badge.kiv{background:var(--warn-tint);color:var(--warn);}
  .badge.offboarding{background:#E4E4E3;color:#54524F;}
  .badge.rejected{background:var(--danger-tint);color:var(--danger);}
  .badge.hired{background:var(--ok-tint);color:var(--ok);}
  .badge.withdrawn{background:#EDEDEC;color:var(--ink-soft);}
  .badge.blacklisted{background:#1a1a1a;color:#fff;}

  .status-panel{
    position:absolute;top:100%;left:0;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;
    box-shadow:var(--shadow-md);z-index:15;min-width:160px;padding:4px;
  }
  .status-panel-btn{
    display:block;width:100%;text-align:left;padding:8px 10px;font-family:inherit;font-size:12.5px;font-weight:600;
    background:none;border:none;border-radius:6px;cursor:pointer;color:var(--ink);
  }
  .status-panel-btn:hover{background:var(--cream);}
  .status-panel-btn.current{color:var(--accent);}

  .pagination{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:13px;color:var(--ink-soft);}
  .pagination .controls{display:flex;gap:6px;align-items:center;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);border-radius:var(--radius);}

  img.pfp,.pfp{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#eee;flex-shrink:0;}
  .pfp-placeholder{display:flex;align-items:center;justify-content:center;background:var(--navy);color:#fff;font-weight:700;font-size:16px;font-family:'Source Serif 4',serif;}
  .name-cell{display:flex;align-items:center;gap:10px;}
  .row-check{width:16px;height:16px;cursor:pointer;accent-color:var(--navy);}
  tr.row-selected td{background:var(--accent-tint);}
  tr.row-selected:hover td{background:var(--accent-tint);}

  .bulk-toolbar{
    background:var(--navy);color:#fff;border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:var(--shadow-md);
    animation:bulkIn .15s ease;
  }
  @keyframes bulkIn{ from{opacity:0;transform:translateY(-4px);} to{opacity:1;transform:translateY(0);} }
  .bulk-toolbar .bulk-count{font-weight:700;font-size:13.5px;margin-right:auto;}
  .bulk-toolbar select{font-family:inherit;font-size:13px;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--navy);}
  .bulk-toolbar .btn-accent,
  .bulk-toolbar .btn-outline{background:#fff;color:var(--navy);border-color:#fff;}
  .bulk-toolbar .btn-accent:hover,
  .bulk-toolbar .btn-outline:hover{background:var(--cream);}
  .bulk-toolbar .bulk-clear{opacity:.85;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,10,10,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;z-index:50;}
  .modal{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:32px;box-shadow:var(--shadow-lg);}
  .modal-close{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink-soft);line-height:1;padding:4px;}
  .modal-close:hover{color:var(--ink);}
  .detail-section{margin-bottom:18px;}
  .detail-section h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:0 0 8px;border-top:1px solid var(--line);padding-top:14px;}
  .detail-section:first-of-type h4{border-top:none;padding-top:0;}
  .drow{display:flex;font-size:13.5px;padding:3px 0;}
  .drow .k{width:42%;color:var(--ink-soft);}
  .drow .v{width:58%;font-weight:500;}
  .status-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}

  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--navy);}
  .field input, .field select{font-family:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;}

  /* Offboarding — HR sign-off box on the Exit Interview section. Plain,
     self-contained styling (not reusing a candidate-side class) since
     admin.html and index.html deliberately keep separate smaller CSS sets —
     see the class-mismatch trap noted elsewhere in this file's history. */
  .sign-checkbox-row{display:flex;align-items:flex-start;gap:10px;background:#FAFAF9;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;}
  .sign-checkbox-row input{margin-top:3px;}
  .exit-reason-chip{display:inline-block;background:var(--accent-tint);color:var(--accent-dark);border-radius:14px;padding:3px 10px;font-size:11.5px;margin:2px 4px 2px 0;}

  /* Analytics page */
  .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
  .metric-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm);}
  .metric-card .metric-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:6px;}
  .metric-card .metric-value{font-family:'Source Serif 4',serif;font-size:28px;font-weight:700;color:var(--navy);}
  .metric-card .metric-note{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
  .chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .chart-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);}
  .chart-card h3{font-size:14px;margin:0 0 14px;color:var(--navy);}
  .chart-card.full-width{grid-column:1 / -1;}
  .chart-canvas-wrap{position:relative;height:260px;}
  @media(max-width:900px){ .chart-grid{grid-template-columns:1fr;} }

  /* Clean, styled <select> — used wherever a plain browser-default dropdown
     (e.g. Company/Entity assignment) needs to match the rest of the design
     system instead of looking like unstyled OS chrome. */
  .select-clean{
    font-family:inherit;font-size:13.5px;padding:9px 34px 9px 12px;border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--ink);appearance:none;-webkit-appearance:none;-moz-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%236B6D70'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease;
  }
  .select-clean:hover{border-color:#C9C9C8;}
  .select-clean:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);}

  .loading-overlay{position:fixed;inset:0;background:rgba(10,10,10,.5);display:flex;align-items:center;justify-content:center;z-index:99;color:#fff;font-weight:600;}
  .spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .login-page{min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--navy);padding:24px;}
  .login-bg-layer{position:absolute;inset:-10px;background-size:cover;background-position:center;filter:blur(2px) brightness(.72) saturate(1.1);transform:scale(1.03);}
  .login-overlay{position:absolute;inset:0;background:linear-gradient(160deg,rgba(16,27,45,.62),rgba(16,27,45,.42) 45%,rgba(62,92,118,.3));}
  .login-card{position:relative;z-index:2;max-width:400px;width:100%;background:rgba(255,255,255,.98);border-radius:16px;padding:40px 36px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35);}
  .login-card-logo{height:40px;margin-bottom:16px;}
  .login-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-bottom:6px;}
  .login-card input:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-tint);
}
  .pw-toggle-btn{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    background:#fff;border:1px solid var(--line);border-radius:7px;
    color:var(--ink-soft);cursor:pointer;padding:0;transition:background .15s ease,color .15s ease;
  }
  .pw-toggle-btn:hover{background:var(--cream);color:var(--navy);}
  /* Some browsers (Edge, some Safari versions) inject their own built-in
     password reveal/clear icon on the right edge of a password field. We
     already have a custom show/hide button positioned there, so suppress
     the native one everywhere it can appear — otherwise the two icons
     visually stack on top of each other. */
  input[type="password"]::-ms-reveal,
  input[type="password"]::-ms-clear{ display:none; }
  input[type="password"]::-webkit-textfield-decoration-container{ visibility:hidden; }
  input[type="password"]::-webkit-credentials-auto-fill-button,
  input[type="password"]::-webkit-contacts-auto-fill-button{ display:none !important; visibility:hidden; pointer-events:none; position:absolute; right:0; }
  .error-banner{background:var(--danger-tint);border:1px solid #EBC3BD;color:var(--danger);padding:10px 14px;border-radius:8px;font-size:13px;margin-top:14px;}
  .success-banner{background:var(--ok-tint);border:1px solid #BEDACB;color:var(--ok);padding:10px 14px;border-radius:8px;font-size:13px;margin-top:14px;}

  /* ==========================================================================
     MOBILE — additive only; every rule above this block is untouched, so
     the desktop dashboard layout doesn't change at all.
     ========================================================================== */
  @media(max-width:820px){
    /* Sidebar becomes a fixed-position drawer, hidden off-canvas by default,
       slid in over a dimmed backdrop when toggled — the "collapsed" desktop
       width doesn't apply here, an opened drawer is always full width so
       labels stay readable on a touch screen. */
    .sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;transform:translateX(-100%);box-shadow:var(--shadow-lg);}
    .sidebar.mobile-open{transform:translateX(0);}
    .sidebar.collapsed{width:250px;}
    .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(10,10,10,.5);z-index:29;}
    .sidebar-backdrop.show{display:block;}

    .topbar-slim{padding:10px 14px;}
    .topbar-slim .page-subtitle{display:none;}

    .wrap{padding:14px 10px 40px;}

    .stat-row{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
    .stat{min-width:118px;}

    /* Toolbar: stack search/filters/buttons full-width instead of
       squeezing them into one row that wraps unpredictably. */

function toggleSidebar(){

// ============================================================================
// TOPBAR USER PROFILE — since Phase 1, every admin signs in with their real
// Microsoft identity instead of a shared passcode, so showing who's actually
// logged in (and moving Logout here, out of the sidebar) makes more sense
// than before. Standard Microsoft/Entra ID sign-in reliably gives us name +
// email; it does NOT reliably give a profile photo (that needs a separate
// Microsoft Graph API call with extra permissions this project doesn't have
// wired up) — so the avatar is an initials circle, matching the same
// pfp-placeholder pattern already used elsewhere in this file for
// candidates without a photo, rather than something that might silently
// come back blank.
// ============================================================================
let currentUserProfile = null; // {name, email} once signed in via Microsoft
let userMenuOpen = false;

// Populated directly from the Microsoft ID token's own claims right after a
// fresh sign-in (see attemptAdminBootstrap()) — no extra API call needed in
// that case, since the ID token already carries name + email. But on a
// plain page reload there's no fresh ID token to read (MSAL's popup flow
// doesn't persist a restorable session the way Supabase's did) even though
// the admin JWT itself is still sitting in localStorage and still works —
// so `currentUserProfile` would otherwise stay null and the topbar chip/
// Log out button would silently disappear on every refresh. GET /admin/me
// exists purely to cover that gap: fetch it once, only when a token is
// present but nothing has been loaded into memory yet.
async function loadCurrentUserProfile(){
  if(!currentUserProfile && adminToken){
    const { data } = await apiTry(() => api.get('/admin/me', {admin: true}));
    if(data) currentUserProfile = { name: data.display_name || data.email || '', email: data.email || '' };
  }
  renderTopbarUser();
}

  `;
}

// ============================================================================
// RENDER DISPATCH
// ============================================================================
// `lastRenderedView` lets us tell the difference between "navigating into
// the Home view" (needs the full shell — stat cards, toolbar, search input —
// rebuilt) and "data on the Home view changed" (only the results table/stats
// need updating). Previously every keystroke in the search box triggered a
// full teardown-and-rebuild of the whole dashboard, including the search
// input itself — that's what caused the lag and the cursor jumping back
// (the old fix tried to manually restore focus/cursor position after the
// rebuild, but that's fighting the real problem instead of avoiding it).
// Now the search input's DOM node is never touched by a data refresh, so
// the browser's own text-cursor handling just works, with nothing to fix.
// ============================================================================
let lastRenderedView = null;

function render(){
  const root = document.getElementById('root');
  const appShellEl = document.getElementById('appShell');
  if(appShellEl) appShellEl.classList.toggle('pre-auth', !adminToken);
  renderTopbarUser();
  const scopeEl = document.getElementById('sidebarScope');
  if(scopeEl) scopeEl.textContent = adminToken ? (adminScope==='ALL' ? 'All Units Access' : adminScope+' Access') : '';

  const navEl = document.getElementById('sidebarNav');
  if(navEl){
    const newCount = stats.by_status?.submitted || 0;
    navEl.innerHTML = adminToken ? `
      <a class="${currentView==='home'?'active':''}" onclick="setView('home')" title="Dashboard">${NAV_ICONS.home}<span class="nav-label">Dashboard</span>${newCount>0?`<span class="nav-badge">${newCount}</span>`:''}</a>
      <a class="${currentView==='analytics'?'active':''}" onclick="setView('analytics')" title="Analytics">${NAV_ICONS.analytics}<span class="nav-label">Analytics</span></a>

      ${adminScope==='ALL' ? `<a class="${currentView==='permissions'?'active':''}" onclick="setView('permissions')" title="Business Unit Settings">${NAV_ICONS.permissions}<span class="nav-label">Business Unit Settings</span></a>` : ''}
      <!-- Manager Settings retired — notification recipients are now derived
           live from Admin Access (admin_grants) instead of a manually-typed
           email per business unit. See retire_manager_settings.sql. The
           underlying settingsPageView()/rpc_admin_get_settings() are left in
           place, unused, same "never drop, just stop using" pattern as
           everything else orphaned in this project. -->
      
      ${adminScope==='ALL' ? `<a class="${currentView==='adminAccess'?'active':''}" onclick="setView('adminAccess')" title="Admin Access">${NAV_ICONS.adminAccess}<span class="nav-label">Admin Access</span></a>` : ''}
    ` : '';
  }
  const titleEl = document.getElementById('pageTitle');
  const subtitleEl = document.getElementById('pageSubtitle');
  if(titleEl){
    const t = PAGE_TITLES[currentView] || ['',''];
    titleEl.textContent = t[0];
    if(subtitleEl) subtitleEl.textContent = t[1];
  }
  renderSidebarChrome();

  if(!adminToken){ root.innerHTML = loginView(); lastRenderedView = null; return; }

  if(currentView === 'home'){
    if(lastRenderedView !== 'home' || !document.getElementById('dashResults')){
      root.innerHTML = `<div class="wrap">${dashboardShellHtml()}</div>`;
      lastRenderedView = 'home';
    } else {
      renderDashboardResults();
    }
  } else if(currentView === 'companies'){
    // Same shell-vs-results split as Home: rebuilding the whole page on
    // every search keystroke would blow away focus/cursor position in the
    // search input (see the note on `lastRenderedView` above).
    if(lastRenderedView !== 'companies' || !document.getElementById('companyMgmtResults')){
      root.innerHTML = `<div class="wrap">${companySettingsPageView()}</div>`;
      lastRenderedView = 'companies';
    } else {
      renderCompanyMgmtResults();
    }
  } else if(currentView === 'analytics'){
    root.innerHTML = `<div class="wrap">${analyticsPageView()}</div>`;
    lastRenderedView = 'analytics';
    // Charts need their <canvas> elements to actually exist in the DOM
    // first — renderAnalyticsCharts() runs right after this innerHTML
    // assignment completes, not before.
    renderAnalyticsCharts();
  } else if(currentView === 'aiInsights'){
    root.innerHTML = `<div class="wrap">${aiInsightsPageView()}</div>`;
    lastRenderedView = 'aiInsights';
  } else if(currentView === 'adminAccess'){
    // Same shell-vs-results split as Companies — the invite form lives in
    // the shell, not the results container.
    if(lastRenderedView !== 'adminAccess' || !document.getElementById('adminMgmtResults')){
      root.innerHTML = `<div class="wrap">${adminAccessPageView()}</div>`;
      lastRenderedView = 'adminAccess';
    } else {
      renderAdminMgmtResults();
    }
  } else {
    let pageContent;
    if(currentView==='settings') pageContent = settingsPageView();
    else if(currentView==='permissions') pageContent = permissionsPageView();
    root.innerHTML = `<div class="wrap">${pageContent}</div>`;
    lastRenderedView = currentView;
  }
  if(selectedApp) renderModal();
}
async function setView(view){
  currentView = view;

  if(view==='adminAccess'){ adminMgmtInviteOpen = false; adminMgmtGrantFormFor = null; await loadAdminMgmtList(); }
  render();
}

// ============================================================================
// ENTRA ID (AZURE AD) LOGIN — replaces the shared passcode entirely.
// MSAL.js (oauth.js, signed in against the separate "WCT Admin" Azure app
// registration — window.MS_CLIENT_ID above, distinct from candidate
// Microsoft sign-in's app) gets a signed ID token directly from Microsoft in
// a popup — no
// page redirect/reload round-trip anymore, so there's no "restore state
// after coming back from the OAuth provider" step either. That ID token is
// verified SERVER-SIDE (backend/src/lib/oauthVerify.js) by two endpoints:
//   POST /api/admin/auth/microsoft  — resolves grants (the authorization
//     gate: the Azure app itself allows any Microsoft account to sign in,
//     "All Microsoft account users" — being invited via admin_grants is
//     what actually restricts dashboard access, same as before).
//   POST /api/admin/auth/session    — re-verifies the SAME id_token and
//     mints the actual admin session JWT, once the business unit (if
//     needed) is known.
//
// The old passcode system (admin_config, doLogin(),
// togglePasscodeVisibility()) is left completely in place further down —
// just no longer linked from this login screen — as a manual break-glass
// fallback (POST /api/admin/auth/login), matching this project's
// established "never drop, just stop using" convention.
// ============================================================================
let pendingMsIdToken = null; // held only between the grants check and BU choice/session mint

async function doMicrosoftLogin(){
  try{
    const idToken = await signInWithMicrosoft();
    await attemptAdminBootstrap(idToken);
  } catch(e){
    loginStage = 'error'; loginErrorMsg = e.message || String(e); render();
  }
}

async function attemptAdminBootstrap(idToken, chosenBU){
  try{
    const tokenToUse = idToken || pendingMsIdToken;
    const { data: g, error: grantsErr } = await apiTry(() => api.post('/admin/auth/microsoft', { id_token: tokenToUse }));
    if(grantsErr) throw grantsErr;
    if(!g || !g.authorized){
      loginStage = 'error';
      loginErrorMsg = "Your account isn't set up as an admin yet. Contact your Super Admin to be added.";
      render();
      return;
    }
    if(!g.is_super_admin && (g.bu_grants||[]).length > 1 && !chosenBU){
      availableBuGrants = g.bu_grants;
      pendingMsIdToken = tokenToUse;
      loginStage = 'choosing_bu';
      render();
      return;
    }
    const business_unit = g.is_super_admin ? null : (chosenBU || (g.bu_grants||[])[0] || null);
    const { data: sessionData, error: sessionErr } = await apiTry(() => api.post('/admin/auth/session', { id_token: tokenToUse, business_unit }));
    if(sessionErr) throw sessionErr;
    adminToken = sessionData.token;
    adminScope = sessionData.unit_scope;
    api.setAdminToken(adminToken);
    sessionStorage.setItem('wct_admin_scope', adminScope);
    pendingMsIdToken = null;
    const claims = decodeJwtPayload(tokenToUse) || {};
    currentUserProfile = { name: claims.name || g.email || '', email: g.email || claims.preferred_username || '' };
    if(adminScope !== 'ALL') filterBusinessUnit = adminScope;
    loginStage = 'signin';
    render();
    await loadEverything();
    await openDeepLinkedAppIfAny();
    loadCurrentUserProfile();
  } catch(e){
    loginStage = 'error';
    loginErrorMsg = e.message || String(e);
    render();
  }
}
function chooseBuAndContinue(bu){ attemptAdminBootstrap(null, bu); }
function retryLogin(){ loginStage = 'signin'; loginErrorMsg = ''; render(); }

// The status panel is markup'd inside a `position:relative` table cell so
// by default it just drops below the status badge. That breaks down for
// rows near the bottom of the viewport (or once the page has scrolled) —
// the panel can render off-screen or get visually clipped. CSS Anchor
// Positioning (`position-area` + `position-try-fallbacks: flip-block`)
// would be the declarative fix for this, but per modern-web-guidance it
// isn't supported by any major browser yet, so this follows the guide's
// recommended fallback instead: switch the open panel to `position:fixed`
// and compute its coordinates with getBoundingClientRect, flipping it
// above the badge whenever there isn't enough room below.
function positionOpenStatusPanel(){
  if(!openStatusPanelId) return;
  const panel = document.querySelector('.status-panel');
  if(!panel) return;
  const badge = panel.previousElementSibling;
  if(!badge) return;
  const badgeRect = badge.getBoundingClientRect();
  const panelRect = panel.getBoundingClientRect();
  const margin = 4;
  const spaceBelow = window.innerHeight - badgeRect.bottom;
  const openUpward = spaceBelow < (panelRect.height + margin) && badgeRect.top > (panelRect.height + margin);
  panel.style.position = 'fixed';
  panel.style.margin = '0';
  panel.style.top = openUpward
    ? `${Math.max(margin, badgeRect.top - panelRect.height - margin)}px`
    : `${badgeRect.bottom + margin}px`;
  let left = badgeRect.left;
  const maxLeft = window.innerWidth - panelRect.width - margin;
  if(left > maxLeft) left = Math.max(margin, maxLeft);
  panel.style.left = `${left}px`;
}
// Re-run the positioning while the panel is open if the page scrolls or
// the window resizes, so it stays anchored to the badge instead of
// drifting once it's been switched to position:fixed. `capture:true` on
// scroll also catches scrolling inside a nested scrollable container
// (not just the window itself).
window.addEventListener('scroll', function(){ if(openStatusPanelId) positionOpenStatusPanel(); }, true);
window.addEventListener('resize', function(){ if(openStatusPanelId) positionOpenStatusPanel(); });

// ---------------------------------------------------------------------------
// BATCH MANAGEMENT — selection is scoped to what's currently loaded (one
// page of results); there's no server-side "select all matching filter"
// since bulk status/delete calls loop the existing single-record RPCs
// client-side rather than requiring a new bulk RPC.
// ---------------------------------------------------------------------------
function toggleSelectRow(id, checked){
  if(checked) selectedIds.add(id); else selectedIds.delete(id);
  render();

  applications.forEach(a => checked ? selectedIds.add(a.id) : selectedIds.delete(a.id));

async function applyBulkStatus(){
  const status = document.getElementById('bulkStatusSelect').value;
  if(!status){ alert('Please choose a status to apply first.'); return; }
  const count = selectedIds.size;
  if(status === 'blacklisted' && !confirm(`Blacklist ${count} candidate(s)? They will be signed out immediately and blocked from logging in or applying again using this email.`)) return;
  if(status === 'offboarding' && !confirm(`Move ${count} application(s) to "Offboarding"? Each candidate will be prompted to complete their Exit Interview Form.`)) return;
  if(status !== 'offboarding' && !confirm(`Change status to "${STATUS_LABELS[status]}" for ${count} selected application(s)?`)) return;
  showLoading(`Updating ${count} application(s)...`);
  let failed = 0;
  for(const id of Array.from(selectedIds)){
    try{
      let result;
      if(STATUS_VIA_DEDICATED_RPC[status]){
        result = await apiTry(() => api.post(`/admin/applications/${id}/offboarding`, {}, {admin: true}));
      } else {
        result = await apiTry(() => api.post(`/admin/applications/${id}/status`, {status}, {admin: true}));
      }
      const { error } = result;
      if(error) failed++;
    } catch(e){ failed++; }
  }
  selectedIds.clear();
  hideLoading();
  await Promise.all([loadApplications(), loadStats()]);
  if(failed) alert(`${failed} of ${count} update(s) failed — please check those applications individually.`);
}

async function bulkDelete(){
  const count = selectedIds.size;
  if(!confirm(`Permanently delete ${count} selected application(s)? This cannot be undone.`)) return;
  showLoading(`Deleting ${count} application(s)...`);
  let failed = 0;
  for(const id of Array.from(selectedIds)){
    try{
      const { error } = await apiTry(() => api.del(`/admin/applications/${id}`, {admin: true}));
      if(error) failed++;
    } catch(e){ failed++; }
  }
  selectedIds.clear();
  hideLoading();
  await Promise.all([loadApplications(), loadStats()]);
  if(failed) alert(`${failed} of ${count} deletion(s) failed.`);
}

let searchRequestSeq = 0; // guards against a slow/stale response overwriting a newer one

async function loadApplications(){
  const mySeq = ++searchRequestSeq;
  try{
    const qs = new URLSearchParams();
    qs.set('page', currentPage);
    qs.set('page_size', PAGE_SIZE);
    if(searchTerm) qs.set('search', searchTerm);
    if(filterBusinessUnit) qs.set('business_unit', filterBusinessUnit);
    if(filterStatus) qs.set('status', filterStatus);
    const { data, error } = await apiTry(() => api.get(`/admin/applications?${qs.toString()}`, {admin: true}));
    if(error) throw error;
    if(mySeq !== searchRequestSeq) return; // a newer search/filter/page change has since started — drop this stale result
    applications = data.rows || [];
    totalCount = data.total || 0;
    render();
  } catch(e){
    if(mySeq !== searchRequestSeq) return;
    if(String(e.message||'').includes('expired')||String(e.message||'').includes('Session')){ logout(); }
    else alert('Error loading applications: '+e.message);
  }
}

async function loadStats(){
  try{
    const { data, error } = await apiTry(() => api.get('/admin/stats', {admin: true}));
    if(error) throw error;
    stats = data;
    render();
  } catch(e){ console.error(e); }
}

function toggleStatusPanel(id){

// Registered once at script load (not per-render) — clicking anywhere that
// isn't the open panel itself or the badge that opened it closes it. Without
// this, the only way to dismiss the panel was to pick a status; there was
// no way to just cancel out of it.
document.addEventListener('click', function(e){

});

async function quickUpdateStatus(id, status){
  const label = STATUS_LABELS[status] || status;
  const warnMsg = status === 'blacklisted'
    ? 'Blacklist this candidate? They will be signed out immediately and blocked from logging in or applying again using this email.'
    : status === 'offboarding'
    ? `Move this application to "Offboarding"? The candidate will be prompted to complete their Exit Interview Form.`
    : `Change this application's status to "${label}"? The candidate will be notified by email.`;
  if(!confirm(warnMsg)){ openStatusPanelId = null; loadApplications(); return; }
  openStatusPanelId = null;
  try{
    let result;
    if(STATUS_VIA_DEDICATED_RPC[status]){
      result = await apiTry(() => api.post(`/admin/applications/${id}/offboarding`, {}, {admin: true}));
    } else {
      result = await apiTry(() => api.post(`/admin/applications/${id}/status`, {status}, {admin: true}));
    }
    const { error } = result;
    if(error) throw error;
    await Promise.all([loadApplications(), loadStats()]);
  } catch(e){ alert('Error: '+e.message); loadApplications(); }
}

async function confirmDelete(id, name){
  if(!confirm(`Permanently delete ${name}'s application? This cannot be undone.`)) return;
  try{
    const { error } = await apiTry(() => api.del(`/admin/applications/${id}`, {admin: true}));
    if(error) throw error;
    await Promise.all([loadApplications(), loadStats()]);
  } catch(e){ alert('Error deleting: '+e.message); }
}

function downloadApplicationsCsv(data, filename){
    const jsonCell = (v) => v ? JSON.stringify(v) : '';
    const dt = (v) => v ? new Date(v).toISOString() : '';

    const headers = [
      // -- Job Application: identity & status --
      'Reference No.','Status','Business Unit','Position Applying','Submitted At','Created At','Updated At',
      // -- Personal Particulars --
      'Name (per NRIC)','Alias','Permanent Address','Permanent Postcode','Correspondence Address','Correspondence Postcode',
      'Tel Residence','Tel Office','Mobile Phone','Email','Place of Birth',
      'NRIC No.','Passport No.','Citizen','Marital Status','Date of Birth','Age','Bumiputra','Race',
      // -- Statutory Details (as collected on the application, if any) --
      'App EPF No.','App Income Tax No.','App Tax Branch','App SOCSO No.','App Bank Account No.','App CIDB Green Card No.','App CIDB Branch',
      // -- Language / Education / Experience (JSON) --
      'Language Ability (JSON)','Education (JSON)','Working Experience (JSON)',
      // -- Employment Questions --
      'Resignation Notice Required','Notice Period','Date Available to Start','Expected Basic Salary',
      'Relatives in Company','Relatives Name','Relatives Relationship',
      'Referred by Anyone','Referral Name','Referral Department',
      'Own Transport (Car)','Own Transport (Motorcycle)','Willing Outside Klang Valley',
      'Physical Defects','Physical Defects Specify','Arrested/Convicted','Arrested/Convicted Specify',
      // -- Referees & Declarations --
      'Referee 1 (JSON)','Referee 2 (JSON)','Declaration - Lawsuit (B)','Declaration - Lawsuit Specify','Declaration - Other Matters (C)','Declaration - Other Matters Specify',
      // -- Attachments & Consent --
      'Passport Size Photo URL','Attachments (JSON)','Consent Language',
      'JTS Agreed','JTS Agreed Name','JTS Agreed NRIC','JTS Agreed Mobile','JTS Agreed At',
      'PDPA Agreed','PDPA Agreed Name','PDPA Agreed NRIC','PDPA Agreed At',
      // -- Onboarding: Statutory Details --
      'Onboarding Status','Onboarding EPF No.','Onboarding Income Tax No.','Onboarding Tax Branch',
      'Onboarding SOCSO No.','Onboarding Bank Account No.','Onboarding CIDB Green Card No.','Onboarding CIDB Branch',
      // -- Onboarding: Spouse & Children --
      'Spouse Name','Spouse NRIC','Spouse Date of Birth','Spouse Working',
      'Children Below 18 (JSON)','Children 18-23 (JSON)',
      // -- Onboarding: Emergency & Beneficiary --
      'Emergency Contacts (JSON)','Beneficiary Name','Beneficiary Relationship','Beneficiary Contact',
      // -- Onboarding: TP3 --
      'TP3 Data (JSON)',
      // -- Onboarding: Salary Crediting --
      'Salary Company','Salary Bank','Salary Branch','Salary Account No.','Salary IC/Passport Submitted',
      // -- Onboarding: Confirmation Records --
      'Personal Details Confirmed','Personal Details Confirmed At',
      'TP3 Confirmed','TP3 Confirmed At',
      'Salary Crediting Confirmed','Salary Crediting Confirmed At'
    ];

    const rows = (data||[]).map(a=>[
      a.reference_no, a.status, a.business_unit, a.position_applying, dt(a.submitted_at), dt(a.created_at), dt(a.updated_at),
      a.name_nric, a.alias, a.permanent_address, a.permanent_postcode, a.correspondence_address, a.correspondence_postcode,
      a.tel_residence, a.tel_office, a.mobile_phone, a.email, a.place_of_birth,
      a.nric_new, a.passport_number, a.citizen, a.marital_status, a.date_of_birth, a.age, a.bumiputra, a.race,
      a.epf_no, a.income_tax_no, a.tax_branch, a.socso_no, a.bank_account_no, a.cidb_green_card_no, a.cidb_branch,
      jsonCell(a.language_ability), jsonCell(a.education), jsonCell(a.working_experience),
      a.resignation_notice_required, a.notice_period, a.date_available_to_start, a.expected_basic_salary,
      a.relatives_in_company, a.relatives_name, a.relatives_relationship,
      a.referral_person, a.referral_name, a.referral_department,
      a.own_transport_motorcar, a.own_transport_motorcycle, a.willing_based_outside_klang_valley,
      a.physical_defects, a.physical_defects_specify, a.arrested_convicted, a.arrested_convicted_specify,
      jsonCell(a.referee1), jsonCell(a.referee2), a.declaration_lawsuit, a.declaration_lawsuit_specify, a.declaration_other_matters, a.declaration_other_matters_specify,
      a.profile_picture_url, jsonCell(a.attachments), a.language_choice,
      a.jts_agreed, a.jts_agreed_name, a.jts_agreed_nric, a.jts_agreed_mobile, dt(a.jts_agreed_at),
      a.pdpa_agreed, a.pdpa_agreed_name, a.pdpa_agreed_nric, dt(a.pdpa_agreed_at),
      a.ob_status, a.ob_epf_no, a.ob_income_tax_no, a.ob_tax_branch,
      a.ob_socso_no, a.ob_bank_account_no, a.ob_cidb_green_card_no, a.ob_cidb_branch,
      a.ob_spouse_name, a.ob_spouse_nric, a.ob_spouse_date_of_birth, a.ob_spouse_working,
      jsonCell(a.ob_children_below_18), jsonCell(a.ob_children_18_to_23),
      jsonCell(a.ob_emergency_contacts), a.ob_beneficiary_name, a.ob_beneficiary_relationship, a.ob_beneficiary_contact,
      jsonCell(a.ob_tp3_data),
      a.ob_salary_company, a.ob_salary_bank, a.ob_salary_branch, a.ob_salary_account_no, a.ob_salary_ic_submitted,
      a.ob_personal_details_confirmed, dt(a.ob_personal_details_confirmed_at),
      a.ob_tp3_confirmed, dt(a.ob_tp3_confirmed_at),
      a.ob_salary_crediting_confirmed, dt(a.ob_salary_crediting_confirmed_at)
    ]);

    const csv = [headers, ...rows].map(row =>
      row.map(cell => `"${String(cell??'').replace(/"/g,'""')}"`).join(',')
    ).join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    link.click();
    URL.revokeObjectURL(url);
}

async function hrSignExitInterview(applicationId){
  const name = document.getElementById('hrSignName').value.trim();
  const position = document.getElementById('hrSignPosition').value.trim();
  const confirmed = document.getElementById('hrSignConfirm').checked;
  if(!name || !position){
    document.getElementById('hrSignErr').innerHTML = `<div class="error-banner">Name and position are both required.</div>`;
    return;
  }
  if(!confirmed){
    document.getElementById('hrSignErr').innerHTML = `<div class="error-banner">Please check the confirmation box to sign.</div>`;
    return;
  }
  if(!confirm('Sign this Exit Interview Form? This is final — the candidate will be emailed a link to their signed copy immediately.')) return;
  showLoading('Signing...');
  try{
    const { data, error } = await apiTry(() => api.post(`/admin/exit-interviews/${applicationId}/sign`, { hr_name: name, hr_position: position }, {admin: true}));
    if(error) throw error;
    exitInterviewData = data;
    await loadPendingExitSignatureCount();
    hideLoading();
    render();
  } catch(e){ hideLoading(); document.getElementById('hrSignErr').innerHTML = `<div class="error-banner">${e.message}</div>`; }
}

function exportExitInterviewPdf(applicationId){
  const a = applications.find(x=>x.id===applicationId) || selectedApp;
  const ei = exitInterviewData;
  if(!ei){ alert('No exit interview data loaded.'); return; }
  const html = buildExitInterviewPdfHtml(a, ei);
  const win = window.open('', '_blank');
  if(!win){ alert('Please allow pop-ups for this site to generate the PDF.'); return; }
  win.document.open();
  win.document.write(html);
  win.document.close();
  win.onload = () => setTimeout(() => win.print(), 400);
}

    // Also (re)load the full entity-category list, not just the permission
    // matrix — see permissionsPageView() below for why: the matrix table
    // only ever holds rows for categories someone has explicitly granted/
    // revoked for at least one business unit, so a brand-new category (just
    // inserted into entity_categories, with zero admin_unit_permissions rows
    // yet) would otherwise be invisible on this page even though it was
    // added successfully.
    const [pmResult] = await Promise.all([
      apiTry(() => api.get('/admin/permission-matrix', {admin: true})),
      loadEntityCategoryList(),
    ]);
    const { data, error } = pmResult;
    if(error) throw error;
    permissionMatrix = data || [];
  } catch(e){ alert('Error loading permissions: '+e.message); permissionMatrix = []; }
}

function permissionsPageView(){
  if(adminScope !== 'ALL'){
    return `<div class="empty-state">Business Unit Settings is only available to All Units admin access.</div>`;
  }
  // Union with entityCategoryList (not just permissionMatrix's own rows) so
  // a freshly-added category with no granted/revoked rows yet still shows
  // up in the table — see the comment in loadPermissionsForPage() above.
  const categories = [...new Set([...entityCategoryList, ...permissionMatrix.map(r=>r.category)])];
  const isGranted = (category, unit) => permissionMatrix.some(r=>r.category===category && r.unit_scope===unit && r.granted);

  return `
    <div class="stat-row">
      <div class="stat" style="flex:none;min-width:auto;">
        <h2 style="font-size:20px;margin:0;">Business Unit Settings</h2>

      </tr></thead>
      <tbody>
        ${categories.map(cat=>`
          <tr class="data-row">
            ${editingEntityCategory===cat ? `
              <td><input type="text" id="renameEntityInput" value="${esc(cat)}" style="width:100%;"></td>
              ${PERMISSION_UNITS.map(()=>`<td style="text-align:center;color:var(--ink-soft);">—</td>`).join('')}
              <td>
                <div class="row-actions">
                  <button class="btn btn-primary btn-sm" onclick="submitRenameEntityCategory('${esc(cat)}')">Save</button>
                  <button class="btn btn-outline btn-sm" onclick="cancelEditEntityCategory()">Cancel</button>
                </div>
              </td>
            ` : `
              <td><strong>${esc(cat)}</strong></td>
              ${PERMISSION_UNITS.map(u=>`
                <td style="text-align:center;">
                  <input type="checkbox" class="row-check" data-cat="${esc(cat)}" data-unit="${esc(u)}" ${isGranted(cat,u)?'checked':''} onchange="togglePermissionCheckbox(this)">
                </td>
              `).join('')}
              <td>
                <div class="row-actions">
                  <button class="btn btn-outline btn-sm" onclick="startEditEntityCategory('${esc(cat)}')">Edit</button>
                  <button class="btn btn-outline btn-sm" onclick="deleteEntityCategory('${esc(cat)}')">Delete</button>
                </div>
              </td>
            `}

        `).join('')}
      </tbody>
    </table>

    <div id="permissionsErr" style="margin-top:14px;"></div>
    <button class="btn btn-primary btn-sm" style="margin-top:6px;" onclick="savePermissionChanges()">Save Changes</button>
  `;
}

function startEditEntityCategory(cat){
  editingEntityCategory = cat;
  render();
}
function cancelEditEntityCategory(){
  editingEntityCategory = null;
  render();
}

// Renaming intentionally doubles as "merge": if the new name typed already
// exists as another entity category (e.g. fixing "aviation" vs "Aviation" by
// renaming one into the other), the backend merges companies and permission
// grants into the surviving name rather than erroring — see PATCH
// /admin/entity-categories/:name.
async function submitRenameEntityCategory(oldName){
  const input = document.getElementById('renameEntityInput');
  const newName = input.value.trim();
  if(!newName){ document.getElementById('permissionsErr').innerHTML = `<div class="error-banner">Entity name is required.</div>`; return; }
  showLoading('Saving...');
  try{
    const { error } = await apiTry(() => api.patch(`/admin/entity-categories/${encodeURIComponent(oldName)}`, { name: newName }, {admin: true}));
    if(error) throw error;
    editingEntityCategory = null;
    await loadPermissionsForPage();
    hideLoading();
    render();
  } catch(e){ hideLoading(); document.getElementById('permissionsErr').innerHTML = `<div class="error-banner">${e.message}</div>`; }
}

async function deleteEntityCategory(cat){
  if(!confirm(`Delete entity category "${cat}"? This only works if no companies currently use it — reassign them first if it fails.`)) return;
  showLoading('Deleting...');
  try{
    const { error } = await apiTry(() => api.del(`/admin/entity-categories/${encodeURIComponent(cat)}`, {admin: true}));
    if(error) throw error;
    await loadPermissionsForPage();
    hideLoading();
    render();
  } catch(e){ hideLoading(); document.getElementById('permissionsErr').innerHTML = `<div class="error-banner">${e.message}</div>`; }
}

async function submitAddEntityCategory(){
  const input = document.getElementById('newEntityCategoryInput');
  const name = input.value.trim();
  if(!name){ document.getElementById('addEntityErr').innerHTML = `<div class="error-banner">Entity name is required.</div>`; return; }
  showLoading('Adding entity...');
  try{
    const { error } = await apiTry(() => api.post('/admin/entity-categories', { category: name }, {admin: true}));
    if(error) throw error;
    input.value = '';
    await loadPermissionsForPage();
    hideLoading();
    render();
  } catch(e){ hideLoading(); document.getElementById('addEntityErr').innerHTML = `<div class="error-banner">${e.message}</div>`; }
}

let pendingPermissionChanges = {}; // unit_scope -> Set of categories, only populated once touched
function togglePermissionCheckbox(el){
  const unit = el.dataset.unit, cat = el.dataset.cat;
  // Track full desired category set per unit the first time that column is touched
  if(!pendingPermissionChanges[unit]){
    pendingPermissionChanges[unit] = new Set(
      permissionMatrix.filter(r=>r.unit_scope===unit && r.granted).map(r=>r.category)
    );
  }
  if(el.checked) pendingPermissionChanges[unit].add(cat);
  else pendingPermissionChanges[unit].delete(cat);
}

async function savePermissionChanges(){
  const units = Object.keys(pendingPermissionChanges);
  if(units.length === 0){ document.getElementById('permissionsErr').innerHTML = `<div class="error-banner">No changes to save.</div>`; return; }
  showLoading('Saving permissions...');
  try{
    for(const unit of units){
      const categories = Array.from(pendingPermissionChanges[unit]);
      const { error } = await apiTry(() => apiRequest('/admin/permission-matrix', {method: 'PUT', body: {unit_scope: unit, categories}, admin: true}));
      if(error) throw error;
    }
    pendingPermissionChanges = {};
    await loadPermissionsForPage();
    hideLoading();
    render();
    document.getElementById('permissionsErr').innerHTML = `<div class="success-banner">Saved.</div>`;
  } catch(e){ hideLoading(); document.getElementById('permissionsErr').innerHTML = `<div class="error-banner">${e.message}</div>`; }
}

// ============================================================================
// ANALYTICS — built entirely from data already fetched for other purposes
// (rpc_admin_export_all for CSV, rpc_admin_get_stats for the stat row,
// rpc_admin_count_pending_exit_signatures for the offboarding banner), so
// this page needed zero new backend endpoints. All charts are computed
// client-side from that same raw row data. Business-unit-scoped admins only
// ever receive their own unit's rows from rpc_admin_export_all, so this
// page is automatically scoped the same way the rest of the dashboard is —
// nothing extra to enforce here.
// ============================================================================
let analyticsRows = [];
let analyticsCharts = {}; // Chart.js instances, keyed by canvas id — destroyed
// and recreated on every load rather than .update()'d in place, since the
// underlying data can change shape (e.g. a business unit going from 0 to 1
// applications) between visits, and this page doesn't need live-refresh.

// ---------------------------------------------------------------------------
// AI ANALYTICS — calls the ai-analytics Supabase Edge Function (holds the
// Gemini API key server-side; never exposed to the browser). Two modes:
//   'summary' — gets ONLY the aggregate numbers already computed for the
//               charts above (analyticsMetrics() + the counts used to draw
//               them) — no candidate-level data at all, nothing to protect.
//   'chat'    — gets a per-application list, but every direct identifier
//               (name, NRIC, email, phone, address, DOB) is stripped before
//               it ever leaves the browser; each row is identified only by
//               its reference_no. See buildAnonymizedDataset() below.
// ---------------------------------------------------------------------------
let aiInsightText = '';
let aiInsightLoading = false;
let aiChatMessages = []; // [{role:'user'|'assistant', content:text}]
let aiChatLoading = false;
let aiChatOpen = false;

async function callAiAnalyticsFunction(body){
  // No Supabase Auth session exists anymore — the only credential we hold is
  // the admin JWT already in localStorage (api.getAdminToken()/adminToken).
  // Backed by the migrated Node/Express endpoint POST /api/admin/ai-insights
  // (src/routes/aiInsights.js) — a byte-for-byte reimplementation of the
  // original Supabase 'ai-analytics' Edge Function, using the same
  // GEMINI_API_KEY server-side. No Supabase session/URL involved anymore.
  if(!adminToken){
    throw new Error('AI features need a Microsoft sign-in session — sign out and back in with "Sign in with Microsoft" to use them (the old passcode fallback doesn\'t carry the session this needs).');
  }
  const { data, error } = await apiTry(() => api.post('/admin/ai-insights', body, {admin: true}));
  if(error) throw error;
  return data.text;
}

// Only non-identifying fields — see the privacy note above. Deliberately
// conservative: if you want the chat to reason about more fields, add them
// here explicitly rather than ever passing a raw application row through.
function buildAnonymizedDataset(){
  return analyticsRows.map(r => ({
    reference_no: r.reference_no,
    status: r.status,
    business_unit: r.business_unit,
    position_applying: r.position_applying || null,
    submitted_at: r.submitted_at,
    referred: r.referral_person === 'Yes'
  }));
}

async function generateAiInsights(){
  aiInsightLoading = true;
  renderAnalyticsAiSection();
  try{
    const m = analyticsMetrics();
    const statusOrder = ['submitted','shortlisted','kiv','hired','offboarding','rejected','blacklisted'];
    const statusCounts = {};
    statusOrder.forEach(s => { statusCounts[STATUS_LABELS[s]||s] = analyticsRows.filter(r=>r.status===s).length; });
    const summaryData = {
      total_applications: m.total,
      hire_rate_percent: m.hireRate,
      hired_count: m.hired,
      submitted_count: m.submittedCount,
      avg_days_to_hire_approx: m.avgDays,
      currently_offboarding: m.offboarding,
      status_breakdown: statusCounts,
      referred_count: analyticsRows.filter(r=>r.referral_person==='Yes').length,
      not_referred_count: analyticsRows.filter(r=>r.referral_person!=='Yes').length,
      business_unit_scope: adminScope
    };
    aiInsightText = await callAiAnalyticsFunction({ mode: 'summary', data: summaryData });
  } catch(e){
    aiInsightText = 'Error: ' + e.message;
  }
  aiInsightLoading = false;
  renderAnalyticsAiSection();
}

function renderAnalyticsAiSection(){
  const el = document.getElementById('aiInsightSection');
  if(el) el.innerHTML = aiInsightSectionHtml();
}
function aiInsightSectionHtml(){
  return `
    <div class="chart-card full-width" style="margin-bottom:16px;">
      <h3>✨ AI Insights</h3>
      ${!aiInsightText && !aiInsightLoading ? `
        <p style="color:var(--ink-soft);font-size:13px;margin:0 0 12px;">Generate a plain-language summary of the trends above, using only the aggregate counts — no candidate data is sent.</p>
        <button class="btn btn-primary btn-sm" onclick="generateAiInsights()">Generate Insights</button>
      ` : aiInsightLoading ? `
        <p style="color:var(--ink-soft);font-size:13px;">Generating...</p>
      ` : `
        <p style="font-size:13.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap;">${esc(aiInsightText)}</p>
        <button class="btn btn-outline btn-sm" onclick="generateAiInsights()">Regenerate</button>
      `}
    </div>
  `;
}

function toggleAiChat(){

async function sendAiChatMessage(){
  const input = document.getElementById('aiChatInput');
  const question = input.value.trim();
  if(!question || aiChatLoading) return;
  input.value = '';
  aiChatMessages.push({ role: 'user', content: question });
  aiChatLoading = true;
  renderAiChatMessages();
  try{
    const answer = await callAiAnalyticsFunction({
      mode: 'chat',
      data: buildAnonymizedDataset(),
      question,
      history: aiChatMessages.slice(0, -1).slice(-10) // last few turns, excluding the question just added
    });
    aiChatMessages.push({ role: 'assistant', content: answer });
  } catch(e){
    aiChatMessages.push({ role: 'assistant', content: 'Error: ' + e.message });
  }
  aiChatLoading = false;
  renderAiChatMessages();
}

// ---------------------------------------------------------------------------
// AI CANDIDATE REVIEW — look up one application by reference number, send
// its non-PII fields (education, experience, salary expectations, etc. —
// same "identify only by reference_no" rule as the chat above) to Gemini,
// get back a Shortlist/KIV/Reject recommendation. This is a suggestion for
// a human to weigh, never an automatic decision — the prompt says so
// explicitly, and nothing in this UI applies the recommendation
// automatically to the real application record.
// ---------------------------------------------------------------------------
let aiReviewCandidate = null; // the matched raw row from analyticsRows, once found
let aiReviewNotFound = false;
let aiRecommendation = '';
let aiRecommendLoading = false;

function findCandidateByRef(){
  const input = document.getElementById('aiReviewRefInput');
  const ref = input.value.trim().toLowerCase();
  aiRecommendation = '';
  if(!ref){ aiReviewCandidate = null; aiReviewNotFound = false; renderAiReviewSection(); return; }
  aiReviewCandidate = analyticsRows.find(r => (r.reference_no||'').toLowerCase() === ref) || null;
  aiReviewNotFound = !aiReviewCandidate;
  renderAiReviewSection();
}

function buildCandidateReviewPayload(row){
  return {
    reference_no: row.reference_no,
    business_unit: row.business_unit,
    position_applying: row.position_applying || null,
    status: row.status,
    education: row.education || [],
    working_experience: row.working_experience || [],
    language_ability: row.language_ability || [],
    expected_basic_salary: row.expected_basic_salary || null,
    notice_period: row.notice_period || null,
    resignation_notice_required: row.resignation_notice_required || null,
    own_transport_motorcar: row.own_transport_motorcar || null,
    own_transport_motorcycle: row.own_transport_motorcycle || null,
    willing_based_outside_klang_valley: row.willing_based_outside_klang_valley || null,
    referral_person: row.referral_person === 'Yes'
  };
}

async function generateAiRecommendation(){
  if(!aiReviewCandidate) return;
  aiRecommendLoading = true;
  renderAiReviewSection();
  try{
    aiRecommendation = await callAiAnalyticsFunction({ mode: 'recommend', data: buildCandidateReviewPayload(aiReviewCandidate) });
  } catch(e){
    aiRecommendation = 'Error: ' + e.message;
  }
  aiRecommendLoading = false;
  renderAiReviewSection();
}

function renderAiReviewSection(){
  const el = document.getElementById('aiReviewSection');
  if(el) el.innerHTML = aiReviewSectionInnerHtml();
}

const RECOMMEND_BADGE_COLOR = { Shortlist: 'var(--ok)', KIV: 'var(--warn)', Reject: 'var(--danger)' };
function formatRecommendationHtml(text){
  const firstLine = text.split('\n')[0] || '';
  const match = firstLine.match(/Recommendation:\s*(Shortlist|KIV|Reject)/i);
  if(!match) return `<p style="font-size:13.5px;line-height:1.6;white-space:pre-wrap;">${esc(text)}</p>`;
  const label = match[1];
  const color = RECOMMEND_BADGE_COLOR[label] || 'var(--ink)';
  const rest = text.slice(firstLine.length).trim();
  return `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
      <span class="badge" style="background:${color};color:#fff;">${esc(label)}</span>
      <span style="font-size:11.5px;color:var(--ink-soft);">AI-suggested — not a final decision</span>
    </div>
    <p style="font-size:13.5px;line-height:1.6;white-space:pre-wrap;margin:0;">${esc(rest)}</p>
  `;
}

function aiReviewSectionInnerHtml(){
  if(!aiReviewCandidate){
    return aiReviewNotFound

      : `<p style="color:var(--ink-soft);font-size:13px;">Enter a reference number above and press Enter, or click Look Up.</p>`;

function aiReviewSectionHtml(){
  return `
    <div class="chart-card full-width" style="margin-bottom:16px;">
      <h3>🎯 AI Candidate Review</h3>
      <p style="color:var(--ink-soft);font-size:13px;margin:0 0 12px;">Look up one application by reference number and get an AI-suggested status recommendation, based on education/experience/expectations only — no names or contact details are sent.</p>

// ---------------------------------------------------------------------------
// AI DOCUMENT ANALYSIS — sends an actual uploaded attachment's file bytes to
// Gemini. UNLIKE every other AI feature on this page, this ONE does NOT
// anonymize its input — a resume/CV very likely contains the candidate's
// real name and other personal details, and there's no way to usefully
// analyze a document without its actual content. That's a real, deliberate
// trade-off, not an oversight — gated behind an explicit consent checkbox
// that must be checked before any "Analyze" button is enabled, and the
// warning stays visible the whole time this section is used.
// ---------------------------------------------------------------------------
let aiDocConsent = false;
let aiDocLoading = false;
let aiDocResult = '';
let aiDocActiveName = '';

function toggleAiDocConsent(checked){
  aiDocConsent = checked;
  renderAiDocSection();
}

async function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

async function analyzeAttachment(url, name, mimeType){
  if(!aiDocConsent) return;
  aiDocLoading = true;
  aiDocActiveName = name;
  aiDocResult = '';
  renderAiDocSection();
  try{
    const fileRes = await fetch(url);
    if(!fileRes.ok) throw new Error('Could not download the file to analyze');
    const blob = await fileRes.blob();
    const fileBase64 = await blobToBase64(blob);
    aiDocResult = await callAiAnalyticsFunction({
      mode: 'document',
      fileBase64,
      mimeType: mimeType || blob.type || 'application/octet-stream',
      data: { position_applying: aiReviewCandidate ? aiReviewCandidate.position_applying : null }
    });
  } catch(e){
    aiDocResult = 'Error: ' + e.message;
  }
  aiDocLoading = false;
  renderAiDocSection();
}

function renderAiDocSection(){
  const el = document.getElementById('aiDocSection');
  if(el) el.innerHTML = aiDocSectionInnerHtml();
}

function aiDocSectionInnerHtml(){
  const attachments = (aiReviewCandidate && aiReviewCandidate.attachments) || [];
  return `
    <div style="background:#FDEDEC;border:1px solid #F3C6C4;border-radius:8px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;">
      <input type="checkbox" id="aiDocConsentCheckbox" ${aiDocConsent?'checked':''} onchange="toggleAiDocConsent(this.checked)" style="margin-top:2px;">
      <label for="aiDocConsentCheckbox" style="font-size:12.5px;">I understand that analyzing a document sends its actual file content — which very likely includes the candidate's real name and other personal details — to Google's Gemini API. This is different from every other AI feature on this page, which never sends personal data.</label>
    </div>
    ${!aiReviewCandidate ? `
      <p style="color:var(--ink-soft);font-size:13px;">Look up a candidate above first, then their attachments will appear here.</p>
    ` : attachments.length === 0 ? `
      <p style="color:var(--ink-soft);font-size:13px;">This candidate has no uploaded attachments.</p>
    ` : `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${attachments.map(f => `
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;">
            <span style="font-size:13px;word-break:break-all;">${esc(f.name)}</span>

function analyticsMetrics(){
  const rows = analyticsRows;
  const total = rows.length;
  const submittedRows = rows.filter(r => r.status !== 'draft');
  const hired = rows.filter(r => r.status === 'hired').length;
  const offboarding = rows.filter(r => r.status === 'offboarding').length;
  const hireRate = submittedRows.length ? Math.round((hired / submittedRows.length) * 100) : 0;

  // Average days from submission to last update, for hired candidates only —
  // this is an APPROXIMATION (there's no dedicated hired_at timestamp; updated_at
  // can also move for unrelated reasons like a company assignment made after
  // hiring), not an exact time-to-hire figure. Labelled as such in the UI.
  const hiredWithDates = rows.filter(r => r.status === 'hired' && r.submitted_at && r.updated_at);
  let avgDays = null;
  if(hiredWithDates.length){
    const totalDays = hiredWithDates.reduce((sum, r) => {
      const days = (new Date(r.updated_at) - new Date(r.submitted_at)) / 86400000;
      return sum + Math.max(0, days);
    }, 0);
    avgDays = Math.round(totalDays / hiredWithDates.length);
  }

  // Compliance flags — applications where the candidate declared Yes to
  // either the lawsuit or other-matters declaration, worth a human double-check.
  const flaggedCount = rows.filter(r => r.declaration_lawsuit==='Yes' || r.declaration_other_matters==='Yes').length;

  // Company/entity assignment progress — only counts non-draft rows, since a
  // draft was never expected to have one yet.
  const assignableRows = rows.filter(r => r.status !== 'draft');
  const assignedCount = assignableRows.filter(r => r.company_id).length;

  return { total, submittedCount: submittedRows.length, hired, offboarding, hireRate, avgDays, flaggedCount, assignedCount, unassignedCount: assignableRows.length - assignedCount };
}
