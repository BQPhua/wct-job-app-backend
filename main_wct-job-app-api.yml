# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# The App Service has SCM_DO_BUILD_DURING_DEPLOYMENT=false, so Azure never runs
# `npm install` itself. Dependencies are therefore installed here and shipped
# inside release.zip. `clean: true` wipes the old wwwroot first, including a
# stale oryx-manifest.toml + node_modules.tar.gz from an earlier build that
# otherwise gets unpacked over the real node_modules at startup (that is what
# caused "Cannot find module 'pdfkit'" on 30 Sep 2026).

name: Build and deploy Node.js app to Azure Web App - wct-job-app-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Check the app loads
        run: node -e "require('./src/app'); console.log('app.js loads OK')"
        env:
          NODE_ENV: production

      - name: Zip for deployment
        run: zip -r -q release.zip . -x '.git/*' 'test/*' 'WCT-*' '.github/*'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F4B6DE03534442A986F9843C441C9917 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D726A74A66DC4D79B605370555632E01 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_95E916D1FE3F4D27848563E67D64566F }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'wct-job-app-api'
          slot-name: 'Production'
          package: release.zip
          clean: true
